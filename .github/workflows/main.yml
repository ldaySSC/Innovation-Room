/* ===================================================================
   TIMELINE RENDER + INTERACTIONS
   =================================================================== */
const timeline   = document.getElementById('timeline');
const viewport   = document.getElementById('viewport');
const decadeBand = document.getElementById('decadeBand');

events.sort((a, b) => a.year - b.year);

const TAP_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V6a2 2 0 0 1 4 0v6"/><path d="M13 8.5a2 2 0 0 1 4 0V13"/><path d="M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1c-3.5 0-5.5-2-6.5-4.5L4 13a2 2 0 0 1 3.6-1.7L9 13"/></svg>';

events.forEach((e, idx) => {
  const item = document.createElement('div');
  item.className = 'event';
  item.setAttribute('data-idx', idx);
  item.setAttribute('data-category', e.category || 'milestone');
  item.style.animationDelay = (idx * 0.06) + 's';
  item.innerHTML =
    '<div class="connector"></div>' +
    '<div class="year-tag">' + e.year + '</div>' +
    '<div class="dot"  data-idx="' + idx + '"></div>' +
    '<div class="card" data-idx="' + idx + '">' +
      '<div class="title">' + e.title + '</div>' +
      '<div class="short">' + e.short + '</div>' +
      '<div class="tap-icon" aria-hidden="true">' + TAP_ICON_SVG + '</div>' +
    '</div>';
  timeline.appendChild(item);
});

/* Per-event motifs live directly on each event object (see the `events`
   array above). Only above-axis (odd-child) events get a motif so it
   sits under an empty vertical column and never overlaps a card. */

