/* ===================================================================
   VIEW ROUTER
   =================================================================== */
let timelineInitialised = false;
function showView(name) {
  document.body.setAttribute('data-view', name);
  if (name === 'timeline') {
    // Use plain setTimeouts (rAF can be throttled in some contexts).
    // Two passes: one fast for scroll reset, one after the visibility
    // transition settles so measurements are accurate.
    const doInit = () => {
      if (typeof recomputeLoopWidth === 'function') recomputeLoopWidth();
      const vp = document.getElementById('viewport');
      if (vp) vp.scrollLeft = 0;
      if (typeof placeDecadeLabels === 'function') placeDecadeLabels();
    };
    setTimeout(doInit, 0);
    setTimeout(doInit, 300);
  }
}
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-goto]');
  if (!target) return;
  showView(target.getAttribute('data-goto'));
});

