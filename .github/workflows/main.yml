const skylineBand = document.getElementById('skylineBand');

function buildSkyline() {
  skylineBand.innerHTML = '';
  const timelineWidth = timeline.scrollWidth;
  const bandH = skylineBand.getBoundingClientRect().height;
  if (timelineWidth < 100 || bandH < 20) return;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  // Draw directly in CSS-pixel space (viewBox matches CSS size) so 1 svg
  // unit = 1 css px.
  svg.setAttribute('viewBox', '0 0 ' + timelineWidth + ' ' + bandH);
  svg.setAttribute('width', timelineWidth);
  svg.setAttribute('height', bandH);
  svg.setAttribute('preserveAspectRatio', 'none');

  // Faint horizon line along the bottom.
  const groundLine = document.createElementNS(svgNS, 'line');
  groundLine.setAttribute('class', 'sk-ground');
  groundLine.setAttribute('x1', '0');
  groundLine.setAttribute('y1', bandH - 4);
  groundLine.setAttribute('x2', timelineWidth);
  groundLine.setAttribute('y2', bandH - 4);
  svg.appendChild(groundLine);

  // Motifs sit BETWEEN the below-axis bubbles — i.e. at the x-centres
  // of the ABOVE-axis event slots — so no card ever chops a silhouette.
  // The master motif list is decoupled from any specific event so the
  // skyline looks consistent as filters change (Milestones/Acquisitions
  // toggling can't make the "story" collapse to a random subset). We
  // spread the master list evenly across whatever above-axis slots the
  // current filter produced.
  const visibleEvents = Array.from(
    document.querySelectorAll('.event:not([data-clone]):not(.filtered-out)')
  );
  // Above-axis is determined by CSS :nth-child(odd) which counts ALL
  // sibling elements (including hidden .filtered-out events and the
  // .decade-band / .skyline-band siblings). Using the filtered index
  // here would drift out of sync with the actual card side once a
  // filter is applied, so we ask the browser directly.
  const abovePositions = [];
  visibleEvents.forEach(el => {
    if (!el.matches(':nth-child(odd)')) return;
    abovePositions.push(el.offsetLeft + el.offsetWidth / 2);
  });

  const allMotifs = events
    .filter(e => e.motif)
    .slice()
    .sort((a, b) => a.year - b.year)
    .map(e => e.motif);
  if (abovePositions.length === 0 || allMotifs.length === 0) {
    skylineBand.appendChild(svg);
    return;
  }

  // Full band-height motif silhouettes — preserve authored 100:170
  // aspect and cap width so neighbouring below-axis cards can't touch
  // the motif horizontally.
  const evEl = visibleEvents[0];
  const slotW = evEl ? evEl.offsetWidth + parseFloat(getComputedStyle(evEl).marginLeft) * 2 : 122;
  const belowCard = visibleEvents.find(el => el.matches(':nth-child(even)'))?.querySelector('.card');
  const cardRadius = belowCard ? belowCard.getBoundingClientRect().width / 2 : 60;
  const maxHalfW = slotW - cardRadius - 8;
  const maxMotifW = Math.max(60, 2 * maxHalfW);
  const availH = bandH - 8;
  const scale = Math.min(maxMotifW / 100, availH / 170);
  const drawnW = 100 * scale;
  const drawnH = 170 * scale;
  // Lift motifs a bit above the very bottom of the band so they sit
  // higher on screen.
  const yTranslate = bandH - drawnH - 24;

  // Sample motifs from the master list at the same cadence as above-axis
  // positions. If we have more positions than motifs we recycle; if we
  // have more motifs than positions we sub-sample so all above-axis
  // slots get a motif and the sequence stays roughly in year order.
  abovePositions.forEach((centreX, i) => {
    const idx = allMotifs.length === abovePositions.length
      ? i
      : Math.floor(i * allMotifs.length / abovePositions.length);
    const motifName = allMotifs[idx % allMotifs.length];
    const mfn = MOTIF_SVG[motifName];
    if (!mfn) return;
    const tx = centreX - drawnW / 2;
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('transform', 'translate(' + tx + ' ' + yTranslate + ') scale(' + scale + ')');
    g.innerHTML = mfn();
    svg.appendChild(g);
  });

  skylineBand.appendChild(svg);
}

function placeDecadeLabels() {
  decadeBand.innerHTML = '';
  const decadeMap = {};
  document.querySelectorAll('.event:not([data-clone])').forEach((el, i) => {
    if (el.classList.contains('filtered-out')) return;
    const y = events[i].year;
    const d = Math.floor(y / 10) * 10;
    if (!decadeMap[d]) decadeMap[d] = [];
    decadeMap[d].push(el);
  });
  Object.keys(decadeMap).map(Number).sort((a, b) => a - b).forEach(d => {
    const els = decadeMap[d];
    const first = els[0];
    const last  = els[els.length - 1];
    const l = first.offsetLeft + first.offsetWidth / 2;
    const r = last.offsetLeft + last.offsetWidth / 2;
    const center = (l + r) / 2;
    const label = document.createElement('div');
    label.className = 'decade-label';
    label.textContent = d + 's';
    label.style.left = center + 'px';
    decadeBand.appendChild(label);
  });
  buildSkyline();
}
requestAnimationFrame(placeDecadeLabels);

/* Measure the header + filter-bar height and expose as CSS vars so the
   viewport reserves matching padding. Header and filter-bar are absolute
   overlays; padding keeps the visual layout identical in the unzoomed
   state and also stops the viewport from resizing when zoom toggles
   (which would otherwise cause a layout shift mid-animation). */
function measureTopbar() {
  const header = document.querySelector('.view-timeline header');
  const filterBar = document.querySelector('.view-timeline .filter-bar');
  if (!header || !filterBar) return;
  const headerH = header.getBoundingClientRect().height;
  const filterH = filterBar.getBoundingClientRect().height;
  if (headerH <= 0 || filterH <= 0) return;
  document.documentElement.style.setProperty('--header-h', headerH + 'px');
  document.documentElement.style.setProperty('--topbar-h', (headerH + filterH) + 'px');
}
// Belt-and-braces initial measurements: rAF (once painted), then setTimeout
// fallbacks in case rAF is throttled (hidden tab / preview pane), then a
// ResizeObserver so any later layout change (font load, viewport resize,
// UI scale bump) keeps the vars in sync.
requestAnimationFrame(() => { measureTopbar(); placeDecadeLabels(); });
setTimeout(measureTopbar, 0);
setTimeout(measureTopbar, 250);
setTimeout(measureTopbar, 1000);
if (typeof ResizeObserver === 'function') {
  const ro = new ResizeObserver(measureTopbar);
  const header = document.querySelector('.view-timeline header');
  const filterBar = document.querySelector('.view-timeline .filter-bar');
  if (header) ro.observe(header);
  if (filterBar) ro.observe(filterBar);
}
window.addEventListener('resize', () => {
  measureTopbar();
  placeDecadeLabels();
  recomputeLoopWidth();
});

/* Filter */
const activeCategories = new Set(['milestone', 'acquisition']);
const filterPills = document.querySelectorAll('.filter-pill');
// Shared reflow helper. Any state change that resizes or reflows events
// (filter click, UI scale +/−) fades the skyline out, waits for the
// 0.35s .event width/margin CSS transition to settle, then rebuilds the
// skyline ONCE from stable offsetLeft values. Without this, motifs are
// pinned to partially-transitioned event positions and drift out of the
// bubble gaps — visible when the user then zooms into a card.
let _skylineReflowTimer = null;
function scheduleSkylineReflow() {
  skylineBand.classList.add('reflowing');
  if (_skylineReflowTimer) clearTimeout(_skylineReflowTimer);
  _skylineReflowTimer = setTimeout(() => {
    placeDecadeLabels();
    recomputeLoopWidth();
    requestAnimationFrame(() => skylineBand.classList.remove('reflowing'));
  }, 380);
}

function applyFilter() {
  document.querySelectorAll('.event').forEach((el) => {
    const cat = el.getAttribute('data-category') || 'milestone';
    if (activeCategories.has(cat)) el.classList.remove('filtered-out');
    else el.classList.add('filtered-out');
  });
  // Redistribute remaining events across roughly the original timeline
  // width so the layout stays visually consistent under any filter.
  // sqrt scaling keeps the spread balanced — not clustered, not stretched.
  const totalEvents = document.querySelectorAll('.event:not([data-clone])').length;
  const visibleEvents = document.querySelectorAll(
    '.event:not([data-clone]):not(.filtered-out)'
  ).length;
  const scale = visibleEvents > 0
    ? Math.pow(totalEvents / visibleEvents, 0.5)
    : 1;
  document.documentElement.style.setProperty('--event-gap-scale', scale.toFixed(3));

  scheduleSkylineReflow();
}
filterPills.forEach(pill => {
  pill.addEventListener('click', () => {
    const cat = pill.getAttribute('data-filter');
    // Semantics: clicking a filter pill means "show me this category".
    //   * If this is currently the ONLY active category, expand back to
    //     show both — clicking the sole selection acts as a reset.
    //   * Otherwise, make this category the only active one.
    // No path should ever leave zero categories active (would blank the
    // timeline), so we always end with at least one category on.
    const isOnlyActive = activeCategories.has(cat) && activeCategories.size === 1;
    activeCategories.clear();
    if (isOnlyActive) {
      activeCategories.add('milestone');
      activeCategories.add('acquisition');
    } else {
      activeCategories.add(cat);
    }
    filterPills.forEach(p => {
      const pcat = p.getAttribute('data-filter');
      const on = activeCategories.has(pcat);
      p.classList.toggle('active', on);
      p.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    applyFilter();
  });
});

/* Zoom + satellite */
const satLayer  = document.getElementById('satLayer');
const zoomClose = document.getElementById('zoomClose');

const ZOOM_SCALE = 1.6;

let openIdx = -1;
let satEls = [];
let baseDx = 0, baseDy = 0;
let panX = 0, panY = 0;
let focusedEventEl = null;

function applyZoomTransform() {
  timeline.style.transform = 'translate3d(' + (baseDx + panX) + 'px, ' + (baseDy + panY) + 'px, 0) scale(' + ZOOM_SCALE + ')';
  satLayer.style.transform = 'translate3d(' + panX + 'px, ' + panY + 'px, 0)';
}

function zoomToCard(cardEl) {
  const cardRect     = cardEl.getBoundingClientRect();
  const timelineRect = timeline.getBoundingClientRect();
  const originX = cardRect.left + cardRect.width  / 2 - timelineRect.left;
  const originY = cardRect.top  + cardRect.height / 2 - timelineRect.top;
  const cardScreenX = cardRect.left + cardRect.width  / 2;
  const cardScreenY = cardRect.top  + cardRect.height / 2;
  baseDx = window.innerWidth  / 2 - cardScreenX;
  baseDy = window.innerHeight / 2 - cardScreenY;
  panX = 0; panY = 0;
  timeline.style.transformOrigin = originX + 'px ' + originY + 'px';
  applyZoomTransform();
}

function bubbleSlots(n, alignFirstToTop) {
  if (n <= 0) return [];
  const step = 360 / n;
  // With alignFirstToTop, the first slot lands exactly at -90° (straight
  // up above the card). Used when a logo pill needs to sit dead-centre
  // above the main bubble; the remaining slots fan out around the rest
  // of the circle at even 360°/n spacing.
  const start = alignFirstToTop ? -90 : ((n % 2 === 0) ? (-90 - step / 2) : -90);
  const out = [];
  for (let i = 0; i < n; i++) out.push(start + i * step);
  return out;
}

function placeSatellites(cardEl, details) {
  clearSatellites();
  const r = cardEl.getBoundingClientRect();
  const cx = r.left + r.width  / 2;
  const cy = r.top  + r.height / 2;
  // Propagate the parent event's category to every satellite so the
  // pop-out bubbles pick up the matching colored outline (teal for
  // milestones, yellow for acquisitions).
  const eventEl = cardEl.closest('.event');
  const category = (eventEl && eventEl.getAttribute('data-category')) || 'milestone';
  // If a logo-only detail (pill) is present, pull it to index 0 and
  // align the first slot to the top of the fan (-90°). Everything else
  // keeps the standard 360° layout.
  const logoPillIdx = details.findIndex(d => d.image && !d.label && !d.text);
  const hasLogoPill = logoPillIdx >= 0;
  if (hasLogoPill && logoPillIdx !== 0) {
    details = details.slice();
    const pill = details.splice(logoPillIdx, 1)[0];
    details.unshift(pill);
  }
  const n = details.length;
  const angles = bubbleSlots(n, hasLogoPill);
  const cardHalf = Math.max(r.width, r.height) / 2;
  // Match visual satellite footprint at current --s
  const satSizePx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat-size')) || 160;
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  // Effective "footprint" per satellite: use the LARGER of the standard
  // circle (--sat-size) and the pill width so pill-shaped satellites
  // get enough angular room in the fan-out without over-spacing.
  const anyPillPresent = details.some(d => d.image && ['ssc40','advent','intralinks','blueprism','battea','calastone','globeop'].includes(d.image));
  const effectiveSize = anyPillPresent ? Math.max(satSizePx, 260) : satSizePx;
  const satPx = effectiveSize * s;
  const gap = 44 * s;
  const R = cardHalf + gap + satPx / 2;

  // Map image keys → data URIs. Photos and business-unit logos are all
  // embedded as base64 so every image travels inside the single HTML
  // file. Portraits get the round-photo treatment; logos get the
  // wide-photo + white "business-card" bubble so their original palette
  // reads on the dark timeline.
  const dataUri = (mime, b64Var) => (typeof b64Var === 'string' && b64Var.length > 100)
    ? 'data:' + mime + ';base64,' + b64Var
    : null;
  // Note: business-unit logos are pre-processed (whitespace trimmed)
  // into PNG at build time by .claude/trim-whitespace.ps1 →
  // .claude/inject-images.js, so all logo constants are image/png even
  // if the source in the folder was a JPG.
  const IMAGE_LOOKUP = {
    billStone:  dataUri('image/jpeg', typeof BILL_STONE_B64 !== 'undefined' ? BILL_STONE_B64 : ''),
    ssc40:      dataUri('image/png',  typeof SSC40_B64      !== 'undefined' ? SSC40_B64      : ''),
    advent:     dataUri('image/png',  typeof ADVENT_B64     !== 'undefined' ? ADVENT_B64     : ''),
    intralinks: dataUri('image/png',  typeof INTRALINKS_B64 !== 'undefined' ? INTRALINKS_B64 : ''),
    blueprism:  dataUri('image/png',  typeof BLUEPRISM_B64  !== 'undefined' ? BLUEPRISM_B64  : ''),
    battea:     dataUri('image/png',  typeof BATTEA_B64     !== 'undefined' ? BATTEA_B64     : ''),
    calastone:  dataUri('image/png',  typeof CALASTONE_B64  !== 'undefined' ? CALASTONE_B64  : ''),
    globeop:    dataUri('image/png',  typeof GLOBEOP_B64    !== 'undefined' ? GLOBEOP_B64    : '')
  };
  // Keys that use the "logo card" layout: wide-photo (landscape) with a
  // white business-card bubble background so brand palettes read
  // properly against the dark timeline.
  const LOGO_KEYS = new Set(['ssc40', 'advent', 'intralinks', 'blueprism', 'battea', 'calastone', 'globeop']);

  const nodes = details.map((d, i) => {
    const sat = document.createElement('div');
    sat.className = 'satellite';
    sat.setAttribute('data-bubble-idx', i);
    sat.setAttribute('data-category', category);
    const imageUri = d.image ? IMAGE_LOOKUP[d.image] : null;
    if (imageUri) {
      sat.classList.add('has-photo');
      // Business-unit / brand marks get the wide-photo layout and a
      // white "business-card" bubble so the logo's own palette reads.
      // Portrait keys (like billStone) fall through to the circular
      // photo variant.
      if (LOGO_KEYS.has(d.image)) {
        sat.classList.add('wide-photo');
        sat.classList.add('logo-bubble');
      }
      // When a detail has ONLY an image (no label / no text) it's a
      // dedicated logo bubble — render just the image so the mark fills
      // the whole pill. Text-only details still exist as separate
      // satellites in the same fan-out.
      const hasCaption = !!(d.label || d.text);
      if (!hasCaption) sat.classList.add('logo-only');
      sat.innerHTML = hasCaption
        ? ('<div class="sat-body">' +
             '<img class="sat-photo" src="' + imageUri + '" alt="' + (d.text || '') + '">' +
             '<div class="sat-label">' + (d.label || '') + '</div>' +
             '<div class="sat-text">' + d.text + '</div>' +
           '</div>')
        : ('<img class="sat-photo" src="' + imageUri + '" alt="' + (d.label || '') + '">');
    } else {
      sat.innerHTML =
        '<div class="sat-body">' +
          '<div class="sat-label">' + (d.label || '') + '</div>' +
          '<div class="sat-text">' + d.text + '</div>' +
        '</div>';
    }
    // Start collapsed at card centre
    sat.style.transform = 'translate3d(' + cx + 'px, ' + cy + 'px, 0) scale(0.35)';
    sat.style.transitionDelay = (0.08 + i * 0.06) + 's, ' + (0.08 + i * 0.06) + 's';
    const rad = angles[i] * Math.PI / 180;
    sat._target = { tx: cx + R * Math.cos(rad), ty: cy + R * Math.sin(rad) };
    return sat;
  });

  const frag = document.createDocumentFragment();
  nodes.forEach(n => frag.appendChild(n));
  satLayer.appendChild(frag);
  satEls = nodes;

  void satLayer.offsetWidth;

  requestAnimationFrame(() => {
    nodes.forEach(sat => {
      const { tx, ty } = sat._target;
      sat.style.transform = 'translate3d(' + tx + 'px, ' + ty + 'px, 0) scale(1)';
      sat.classList.add('in');
    });
  });
}

function clearSatellites() {
  satEls.forEach(el => el.remove());
  satEls = [];
}

function openDetail(idx, eventElArg) {
  if (openIdx >= 0) return;
  const e = events[idx];
  const eventEl = eventElArg || document.querySelector('.event[data-idx="' + idx + '"]');
  const cardEl  = eventEl ? eventEl.querySelector('.card') : null;
  if (!cardEl) return;
  openIdx = idx;
  focusedEventEl = eventEl;
  document.body.classList.add('is-zoomed');
  eventEl.classList.add('is-focused');
  zoomToCard(cardEl);
  setTimeout(() => {
    placeSatellites(cardEl, e.details || []);
  }, 620);
}

function closeDetail() {
  if (openIdx < 0) return;
  const eventEl = focusedEventEl || document.querySelector('.event[data-idx="' + openIdx + '"]');
  const cardEl  = eventEl ? eventEl.querySelector('.card') : null;
  if (cardEl) {
    const r = cardEl.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top  + r.height / 2;
    satEls.forEach((el, i) => {
      el.style.transitionDelay = (i * 0.02) + 's, ' + (i * 0.02) + 's';
      el.classList.remove('in');
      el.style.transform = 'translate3d(' + cx + 'px, ' + cy + 'px, 0) scale(0.35)';
    });
  }
  // Zoom back to identity — same transition duration as zoom-in (~0.7s)
  setTimeout(() => {
    panX = 0; panY = 0;
    baseDx = 0; baseDy = 0;
    timeline.style.transform = 'translate3d(0px, 0px, 0) scale(1)';
    satLayer.style.transform = 'translate3d(0, 0, 0)';
  }, 200);

  // Remove is-zoomed partway through the transform so surrounding events
  // start fading back in while the card is still returning — the timeline
  // reappears well before the transform lands, no dead time at the end.
  // The 0.7s transform animation itself is untouched.
  setTimeout(() => {
    if (eventEl) eventEl.classList.remove('is-focused');
    document.body.classList.remove('is-zoomed');
    openIdx = -1;
    focusedEventEl = null;
  }, 500);

  // Final cleanup a beat later once fade-in has settled
  setTimeout(() => {
    timeline.style.transformOrigin = '50% 50%';
    timeline.style.transform = '';
    satLayer.style.transform = '';
    clearSatellites();
  }, 900);
}

zoomClose.addEventListener('click', (e) => { e.stopPropagation(); closeDetail(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeBubbleDetail(); closeDetail(); }
});

/* Bubble second-level zoom */
const bubbleDetail = document.getElementById('bubbleDetail');
const bdClose      = document.getElementById('bdClose');
const bdImg        = document.getElementById('bdImg');
const bdLabel      = document.getElementById('bdLabel');
const bdText       = document.getElementById('bdText');
let bubbleOpen = false;
function openBubbleDetail(idx, bubbleIdx) {
  const detail = events[idx].details[bubbleIdx];
  if (!detail) return;
  bdLabel.textContent = detail.label || '';
  bdText.textContent  = detail.text;
  bubbleDetail.classList.add('open');
  bubbleOpen = true;
}
function closeBubbleDetail() {
  if (!bubbleOpen) return;
  bubbleDetail.classList.remove('open');
  bubbleOpen = false;
}
bdClose.addEventListener('click', (e) => { e.stopPropagation(); closeBubbleDetail(); });
bubbleDetail.addEventListener('click', (e) => { if (e.target === bubbleDetail) closeBubbleDetail(); });

/* Unzoomed timeline interactions */
let dragMovedTimeline = false;
timeline.addEventListener('click', (e) => {
  if (dragMovedTimeline) return;
  if (openIdx >= 0) return;
  const hit = e.target.closest('.card, .dot');
  if (!hit) return;
  const idx = parseInt(hit.getAttribute('data-idx'), 10);
  if (isNaN(idx)) return;
  const eventEl = hit.closest('.event');
  openDetail(idx, eventEl);
});

let isDown = false, scrollStart = 0, startPageX = 0;
viewport.addEventListener('mousedown', (e) => {
  if (openIdx >= 0) return;
  isDown = true;
  dragMovedTimeline = false;
  startPageX = e.pageX;
  scrollStart = viewport.scrollLeft;
});
document.addEventListener('mousemove', (e) => {
  if (!isDown) return;
  const delta = e.pageX - startPageX;
  if (Math.abs(delta) > 6) dragMovedTimeline = true;
  viewport.scrollLeft = scrollStart - delta;
});
document.addEventListener('mouseup', () => { isDown = false; });

let tStartX = 0, tScrollStart = 0;
viewport.addEventListener('touchstart', (e) => {
  if (openIdx >= 0) return;
  tStartX = e.touches[0].pageX;
  tScrollStart = viewport.scrollLeft;
  dragMovedTimeline = false;
}, { passive: true });
viewport.addEventListener('touchmove', (e) => {
  if (openIdx >= 0) return;
  const delta = e.touches[0].pageX - tStartX;
  if (Math.abs(delta) > 6) dragMovedTimeline = true;
  viewport.scrollLeft = tScrollStart - delta;
}, { passive: true });
viewport.addEventListener('wheel', (e) => {
  if (openIdx >= 0) return;
  if (e.deltaY !== 0) { e.preventDefault(); viewport.scrollLeft += e.deltaY; }
}, { passive: false });

/* Zoomed pan (drag anywhere) */
let zoomDrag = { active: false, startX: 0, startY: 0, basePX: 0, basePY: 0, moved: false };
function zoomStart(x, y) {
  if (openIdx < 0 || bubbleOpen) return;
  zoomDrag.active = true;
  zoomDrag.startX = x; zoomDrag.startY = y;
  zoomDrag.basePX = panX; zoomDrag.basePY = panY;
  zoomDrag.moved = false;
  timeline.classList.add('no-transition');
  document.body.classList.add('panning');
}
function zoomMove(x, y) {
  if (!zoomDrag.active) return;
  const dx = x - zoomDrag.startX;
  const dy = y - zoomDrag.startY;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) zoomDrag.moved = true;
  panX = zoomDrag.basePX + dx;
  panY = zoomDrag.basePY + dy;
  applyZoomTransform();
}
function zoomEnd() {
  if (!zoomDrag.active) return;
  zoomDrag.active = false;
  timeline.classList.remove('no-transition');
  document.body.classList.remove('panning');
}
window.addEventListener('mousedown', (e) => {
  if (openIdx < 0 || bubbleOpen) return;
  if (e.target.closest('.satellite')) return;
  if (e.target.closest('.zoom-close')) return;
  if (e.target.closest('.bubble-detail')) return;
  zoomStart(e.clientX, e.clientY);
});
window.addEventListener('mousemove', (e) => zoomMove(e.clientX, e.clientY));
window.addEventListener('mouseup',   ()  => zoomEnd());
window.addEventListener('touchstart', (e) => {
  if (openIdx < 0 || bubbleOpen) return;
  if (e.target.closest('.satellite')) return;
  if (e.target.closest('.zoom-close')) return;
  if (e.target.closest('.bubble-detail')) return;
  if (e.touches.length !== 1) return;
  zoomStart(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (!zoomDrag.active) return;
  if (e.touches.length !== 1) return;
  zoomMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchend', () => zoomEnd());
window.addEventListener('touchcancel', () => zoomEnd());

document.addEventListener('click', (e) => {
  if (openIdx < 0) return;
  if (bubbleOpen) return;
  const sat = e.target.closest('.satellite');
  if (sat) {
    if (zoomDrag.moved) return;
    const bIdx = parseInt(sat.getAttribute('data-bubble-idx'), 10);
    if (!isNaN(bIdx) && openIdx >= 0) openBubbleDetail(openIdx, bIdx);
    return;
  }
  if (e.target.closest('.zoom-close')) return;
  if (e.target.closest('.bubble-detail')) return;
  // Any click INSIDE the focused event (card, dot, connector, year tag)
  // should be treated as part of that event — never close the zoom.
  // Previously only `.card` was excluded, so clicking the dot to zoom
  // in was immediately closing the zoom the same click had just opened.
  if (e.target.closest('.event.is-focused')) return;
  if (zoomDrag.moved) return;
  closeDetail();
});

/* ===================================================================
   UI SCALE — +/− control
   =================================================================== */
const SIZE_KEY = 'ssc-timeline-ui-scale';
const SCALE_MIN = 0.5;
const SCALE_MAX = 2.0;
const SCALE_STEP = 0.1;
let uiScale = 1;

function applyUiScale(scale) {
  uiScale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, Math.round(scale * 10) / 10));
  document.documentElement.style.setProperty('--s', uiScale);
  document.getElementById('sizeLabel').textContent = Math.round(uiScale * 100) + '%';
  // Route through the shared reflow so motifs are rebuilt AFTER the
  // 0.35s .event width transition settles — otherwise they end up
  // pinned to partially-transitioned x-positions and drift out of the
  // bubble gaps as the events widen/narrow.
  scheduleSkylineReflow();
  try { localStorage.setItem(SIZE_KEY, String(uiScale)); } catch (e) {}
}
function pickAutoScale() {
  const w = window.innerWidth;
  if (w >= 3000) return 1.3;
  if (w >= 1700) return 1.0;
  if (w >= 1300) return 0.8;
  return 0.7;
}
try {
  const saved = localStorage.getItem(SIZE_KEY);
  applyUiScale(saved ? parseFloat(saved) : pickAutoScale());
} catch (e) {
  applyUiScale(pickAutoScale());
}
document.getElementById('sizePlus').addEventListener('click', () => applyUiScale(uiScale + SCALE_STEP));
document.getElementById('sizeMinus').addEventListener('click', () => applyUiScale(uiScale - SCALE_STEP));

/* ===================================================================
   AUTOPLAY — slow horizontal drift over the original timeline only.
   No clones, no repetition. When the end is reached: pause, briefly
   fade the timeline out, snap scroll back to 0 while invisible, then
   fade back in. Feels like a seamless loop without duplicating events.
   =================================================================== */
const AUTOPLAY_END_PAUSE_MS = 500;  // brief pause at the end before looping
const REWIND_FADE_MS = 160;         // fade-out and fade-in each take this long
                                    // (short enough to feel like a clean cut,
                                    //  not a visible transition)

let autoplayEnabled = false;   // master toggle — the ONLY thing that gates autoplay
let autoplayLastTs = 0;
let rewindState = null;        // { startTs } — active during the fade-out/snap/fade-in
let endPauseUntil = 0;

/* Kept as no-ops so anything that calls them (filter changes, resize)
   doesn't blow up. Autoplay clamps to viewport.scrollWidth directly. */
function recomputeLoopWidth() { /* no-op */ }

function maxScrollLeft() {
  return Math.max(0, viewport.scrollWidth - viewport.clientWidth);
}

/* Fractional scroll accumulator — viewport.scrollLeft rounds to integers,
   which causes stutter when we advance by <1 px per frame. We keep the
   real position with fractional precision here, then round only when we
   write to the DOM. */
let autoplayScrollFloat = 0;
const AUTOPLAY_PX_PER_SEC = 48;   // px/sec, target drift speed

function autoplayTick() {
  const ts = performance.now();
  if (!autoplayLastTs) autoplayLastTs = ts;
  const dt = Math.min(50, ts - autoplayLastTs); // clamp to avoid huge jumps after tab-switch
  autoplayLastTs = ts;

  const canRun = autoplayEnabled
              && openIdx < 0
              && !bubbleOpen
              && document.body.getAttribute('data-view') === 'timeline';

  if (!canRun) {
    // Keep our accumulator in sync with any manual scroll so re-enabling
    // starts from wherever the user currently is.
    autoplayScrollFloat = viewport.scrollLeft;
    // Clear any residual sub-pixel transform (but only if not currently
    // zoomed — zoom owns the transform property).
    if (openIdx < 0 && timeline.style.transform) {
      timeline.style.transform = '';
    }
    // Clear any residual fade opacity from a mid-loop bail-out.
    if (timeline.style.opacity) {
      timeline.style.opacity = '';
    }
    rewindState = null;
    return;
  }

  if (rewindState) {
    // Fade sequence: 0 → REWIND_FADE_MS fades out, cross the midpoint to
    // snap the scroll invisibly to 0, then fade back in over the second
    // REWIND_FADE_MS. Never a visible reverse-scroll.
    const elapsed = ts - rewindState.startTs;
    if (elapsed < REWIND_FADE_MS) {
      timeline.style.opacity = String(1 - elapsed / REWIND_FADE_MS);
    } else if (elapsed < 2 * REWIND_FADE_MS) {
      // Reached the invisible midpoint — jump back to start once.
      if (autoplayScrollFloat > 0) {
        autoplayScrollFloat = 0;
        applyAutoplayScroll();
      }
      timeline.style.opacity = String((elapsed - REWIND_FADE_MS) / REWIND_FADE_MS);
    } else {
      timeline.style.opacity = '';
      rewindState = null;
    }
    return;
  }

  if (ts < endPauseUntil) return;

  const max = maxScrollLeft();
  if (max > 0 && autoplayScrollFloat >= max - 0.5) {
    if (endPauseUntil === 0) {
      endPauseUntil = ts + AUTOPLAY_END_PAUSE_MS;
    } else {
      rewindState = { startTs: ts };
      endPauseUntil = 0;
    }
    return;
  }

  autoplayScrollFloat += (AUTOPLAY_PX_PER_SEC * dt) / 1000;
  applyAutoplayScroll();
}

/* Write the accumulated float position to the viewport.
   Integer portion goes into scrollLeft (so drag/wheel/keyboard/scrollbar
   still work correctly). Fractional remainder goes into a CSS transform
   translate on the timeline — this is sub-pixel and GPU-composited, so
   slow drifts look smooth instead of stepping one integer at a time. */
function applyAutoplayScroll() {
  const whole = Math.floor(autoplayScrollFloat);
  const frac  = autoplayScrollFloat - whole;
  viewport.scrollLeft = whole;
  // Only touch transform when we're NOT zoomed (zoom uses its own transform)
  if (openIdx < 0) {
    timeline.style.transform = frac > 0 ? 'translate3d(' + (-frac) + 'px, 0, 0)' : '';
  }
}

// Drive via setInterval so it's independent of requestAnimationFrame
// throttling (which stalls in backgrounded/hidden tabs). ~16ms cadence
// matches 60fps target.
setInterval(autoplayTick, 16);

/* Whenever the user manually scrolls (drag/wheel), sync the accumulator so
   autoplay picks up smoothly from wherever they left it. */
viewport.addEventListener('scroll', () => {
  if (!autoplayEnabled) autoplayScrollFloat = viewport.scrollLeft;
}, { passive: true });

/* --- Autoplay toggle (top-right) --------------------------------- */
const AUTOPLAY_KEY = 'ssc-timeline-autoplay';
const PLAY_SVG  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const autoplayBtn   = document.getElementById('autoplayToggle');
const autoplayIcon  = document.getElementById('autoplayIcon');
const autoplayLabel = document.getElementById('autoplayLabel');

function renderAutoplayToggle() {
  if (autoplayEnabled) {
    autoplayBtn.classList.add('on');
    autoplayBtn.setAttribute('aria-pressed', 'true');
    autoplayIcon.innerHTML = PAUSE_SVG;
    autoplayLabel.textContent = 'Playing';
  } else {
    autoplayBtn.classList.remove('on');
    autoplayBtn.setAttribute('aria-pressed', 'false');
    autoplayIcon.innerHTML = PLAY_SVG;
    autoplayLabel.textContent = 'Autoplay';
  }
}
autoplayBtn.addEventListener('click', () => {
  autoplayEnabled = !autoplayEnabled;
  if (!autoplayEnabled) {
    endPauseUntil = 0;
    rewindState = null;
  } else {
    // Sync accumulator to wherever the user currently is, so autoplay
    // resumes from that exact position with no jump.
    autoplayScrollFloat = viewport.scrollLeft;
    autoplayLastTs = 0; // fresh dt on next tick
    if (document.body.getAttribute('data-view') !== 'timeline') {
      showView('timeline');
    }
  }
  try { localStorage.setItem(AUTOPLAY_KEY, autoplayEnabled ? '1' : '0'); } catch (err) {}
  renderAutoplayToggle();
});
try {
  const savedAutoplay = localStorage.getItem(AUTOPLAY_KEY);
  autoplayEnabled = savedAutoplay === '1';
} catch (e) {}
renderAutoplayToggle();

/* Position the autoplay toggle just to the LEFT of the size selector so
   they line up visually and never overlap regardless of scale. */
function positionAutoplayToggle() {
  const sizeEl = document.querySelector('.size-selector');
  if (!sizeEl || !autoplayBtn) return;
  const rect = sizeEl.getBoundingClientRect();
  const gap = 10;
  const rightOffset = window.innerWidth - rect.left + gap;
  autoplayBtn.style.right = rightOffset + 'px';
}
requestAnimationFrame(() => requestAnimationFrame(positionAutoplayToggle));
window.addEventListener('resize', positionAutoplayToggle);
// Reposition when the UI scale changes (size-selector's width shifts label size)
const _origApplyUiScale = applyUiScale;
applyUiScale = function(scale) {
  _origApplyUiScale(scale);
  requestAnimationFrame(positionAutoplayToggle);
};

