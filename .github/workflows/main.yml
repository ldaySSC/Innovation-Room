      "Annual returns filed locally",
      "Regulatory notifications"
    ] }
];

const HOW_WE_DO_IT = [
  { name: "Single-source model",
    bullets: [
      "One team for every jurisdiction",
      "End-to-end corporate obligations"
    ] },
  { name: "Digital workflows",
    bullets: [
      "Industry-leading platform",
      "Secure messaging & e-signing",
      "Compliance & document management"
    ] },
  { name: "Independent expertise",
    bullets: [
      "No conflicts of interest",
      "Fund-administrator DNA",
      "Focused only on your outcomes"
    ] }
];

/* Per-jurisdiction data.
   - unique: 2–4 offerings distinctive to that jurisdiction (fund vehicles,
     regulatory scope, market access) so viewers see WHY SS&C is set up
     there and not just "we're everywhere".
   - marker: true → marker-only (no country outline / zoom-to-country)
     for cities that aren't a full ISO country in the map data.
*/
const JURISDICTIONS = [
  { key: "uk", name: "United Kingdom", lat: 54.5, lon:  -2.5,
    labelDx:  14, labelDy: -4,
    regCode: "FCA",  regName: "Financial Conduct Authority",
    unique: ["ACS & OEIC funds", "Long-Term Asset Funds", "Investment Trusts"] },
  { key: "ie", name: "Ireland",        lat: 53.4, lon:  -8.0,
    labelDx: -14, labelDy: -4, anchor: "end",
    regCode: "CBI",  regName: "Central Bank of Ireland",
    unique: ["ICAV set-up", "UCITS & QIAIF", "EU marketing passport"] },
  { key: "je", name: "Jersey",         lat: 49.2, lon:  -2.1,
    labelDx: -14, labelDy: 12, anchor: "end",
    regCode: "JFSC", regName: "Jersey Financial Services Commission",
    unique: ["Jersey Private Funds", "Expert & Listed Funds", "Family-office domicile"] },
  { key: "lu", name: "Luxembourg",     lat: 49.8, lon:   6.1,
    labelDx: 14, labelDy: 4,
    regCode: "CSSF", regName: "Commission de Surveillance du Secteur Financier",
    unique: ["RAIF & SIF vehicles", "SICAV umbrella funds", "Cross-border UCITS hub"] },
  { key: "bm", name: "Bermuda",        lat: 32.3, lon: -64.8,
    labelDx: 14, labelDy: -4,
    regCode: "BMA",  regName: "Bermuda Monetary Authority",
    unique: ["Segregated Accounts Companies", "ILS & re/insurance funds", "Class A & B Exempt Funds"] },
  { key: "ky", name: "Cayman Islands", lat: 19.3, lon: -81.4,
    labelDx: 14, labelDy: -4,
    regCode: "CIMA", regName: "Cayman Islands Monetary Authority",
    unique: ["Exempted Companies & LPs", "Segregated Portfolio Companies", "Hedge & PE fund domicile"] },
  { key: "sg", name: "Singapore",      lat:  1.35, lon: 103.8,
    labelDx: 14, labelDy: -4,
    regCode: "MAS",  regName: "Monetary Authority of Singapore",
    unique: ["Variable Capital Companies", "13O/13U family-office schemes", "APAC servicing hub"] },
  { key: "ad", name: "Abu Dhabi",      lat: 24.47, lon: 54.37,
    labelDx: 14, labelDy: -4,
    regCode: "FSRA", regName: "Financial Services Regulatory Authority",
    unique: ["ADGM Investment Funds", "Restricted Scope Companies", "Middle-East gateway"] }
];

/* Mercator projection. Standard formula, clamped so extreme polar latitudes
   don't blow up. We use a lat window of [-58, 82] which is roughly what a
   world map shows on TV. */
const VB_W = 1000, VB_H = 560;
const LAT_MIN = -58;
const LAT_MAX = 82;
function mercY(lat) {
  const rad = lat * Math.PI / 180;
  return Math.log(Math.tan(Math.PI / 4 + rad / 2));
}
const MERC_Y_TOP    = mercY(LAT_MAX);
const MERC_Y_BOTTOM = mercY(LAT_MIN);
const MERC_Y_RANGE  = MERC_Y_TOP - MERC_Y_BOTTOM;
function project(lon, lat) {
  const clamped = Math.max(LAT_MIN, Math.min(LAT_MAX, lat));
  const x = ((lon + 180) / 360) * VB_W;
  const y = ((MERC_Y_TOP - mercY(clamped)) / MERC_Y_RANGE) * VB_H;
  return [x, y];
}

/* --- Build the map --------------------------------------------- */
const svg = document.getElementById('mapCanvas');
const NS  = 'http://www.w3.org/2000/svg';

/* Set the SVG viewBox to 2:1 world aspect (Mercator crops nicely to this) */
svg.setAttribute('viewBox', '0 0 ' + VB_W + ' ' + VB_H);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

const worldGroup = document.createElementNS(NS, 'g');
worldGroup.setAttribute('class', 'world');
svg.appendChild(worldGroup);

// Subtle grid — parallels of latitude arced for the horizon feel
const gridGroup = document.createElementNS(NS, 'g');
gridGroup.setAttribute('class', 'grid');
for (let latLine = -40; latLine <= 70; latLine += 15) {
  const [, y] = project(0, latLine);
  const line = document.createElementNS(NS, 'path');
  const arc = 6 + Math.abs(y - VB_H / 2) / 30;
  line.setAttribute('d', `M 0 ${y.toFixed(1)} Q 500 ${(y - arc).toFixed(1)} 1000 ${y.toFixed(1)}`);
  line.setAttribute('class', 'grid-line');
  gridGroup.appendChild(line);
}
for (let lonLine = -180; lonLine <= 180; lonLine += 30) {
  const [x] = project(lonLine, 0);
  const line = document.createElementNS(NS, 'path');
  line.setAttribute('d', `M ${x.toFixed(1)} 0 L ${x.toFixed(1)} ${VB_H}`);
  line.setAttribute('class', 'grid-line');
  line.setAttribute('opacity', '0.5');
  gridGroup.appendChild(line);
}
worldGroup.appendChild(gridGroup);

// Countries
const countriesGroup = document.createElementNS(NS, 'g');
countriesGroup.setAttribute('class', 'countries');
function ringToPath(ring) {
  return ring.map(([lon, lat], i) => {
    const [x, y] = project(lon, lat);
    return (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2);
  }).join(' ') + ' Z';
}
function featureToPath(f) {
  const g = f.geometry;
  if (!g) return '';
  if (g.type === 'Polygon') return g.coordinates.map(ringToPath).join(' ');
  if (g.type === 'MultiPolygon') return g.coordinates.flatMap(poly => poly.map(ringToPath)).join(' ');
  return '';
}
function featureBBox(f) {
  const g = f.geometry;
  if (!g) return null;
  let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
  const rings = g.type === 'Polygon' ? g.coordinates
               : g.type === 'MultiPolygon' ? g.coordinates.flat()
               : [];
  rings.forEach(ring => ring.forEach(([lon, lat]) => {
    if (lon < minLon) minLon = lon;
    if (lon > maxLon) maxLon = lon;
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
  }));
  return [minLon, minLat, maxLon, maxLat];
}

/* Some jurisdictions aren't tagged with a `k` property in the embedded
   GeoJSON (e.g. the UAE — Abu Dhabi is a city, not a country in the map
   data). Fall back to a bounding-box signature match so we can still
   highlight the parent country. Signatures are approximate 3-decimal
   bboxes lifted directly from the Natural Earth data.

   UAE signature: lon [51.5, 56.4], lat [22.6, 26.1] */
function inferKeyFromBBox(bbox) {
  if (!bbox) return null;
  const [minLon, minLat, maxLon, maxLat] = bbox;
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  // United Arab Emirates → Abu Dhabi jurisdiction ("ad")
  if (near(minLon, 51.6, 0.6) && near(maxLon, 56.4, 0.6) &&
      near(minLat, 22.6, 0.6) && near(maxLat, 26.1, 0.6)) {
    return 'ad';
  }
  return null;
}

WORLD_GEOJSON.features.forEach(f => {
  const p = document.createElementNS(NS, 'path');
  const explicitKey = f.properties && f.properties.k;
  const bbox = featureBBox(f);
  const key = explicitKey || inferKeyFromBBox(bbox);
  p.setAttribute('class', 'continent' + (key ? ' juris-country' : ''));
  if (key) p.setAttribute('data-key', key);
  p.setAttribute('d', featureToPath(f));
  countriesGroup.appendChild(p);
  if (key) {
    const j = JURISDICTIONS.find(x => x.key === key);
    if (j && bbox) j.bbox = bbox;
  }
});
worldGroup.appendChild(countriesGroup);

// Markers
const markerGroup = document.createElementNS(NS, 'g');
markerGroup.setAttribute('class', 'markers');
JURISDICTIONS.forEach(j => {
  const [x, y] = project(j.lon, j.lat);
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'juris-marker');
  g.setAttribute('data-key', j.key);
  g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);

  const glow = document.createElementNS(NS, 'circle');
  glow.setAttribute('class', 'juris-glow');
  glow.setAttribute('r', '3.5');
  g.appendChild(glow);

  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('class', 'juris-dot');
  dot.setAttribute('r', '3');
  g.appendChild(dot);

  const label = document.createElementNS(NS, 'text');
  label.setAttribute('class', 'juris-label');
  label.setAttribute('x', String(j.labelDx || 0));
  label.setAttribute('y', String(j.labelDy || -8));
  if (j.anchor) label.setAttribute('text-anchor', j.anchor);
  else label.setAttribute('text-anchor', 'start');
  label.textContent = j.name;
  g.appendChild(label);

  const hit = document.createElementNS(NS, 'circle');
  hit.setAttribute('class', 'juris-hit');
  hit.setAttribute('r', '14');
  hit.setAttribute('fill', 'transparent');
  g.appendChild(hit);

  markerGroup.appendChild(g);
});
worldGroup.appendChild(markerGroup);

/* --- Pan / pinch / zoom ---------------------------------------- */
let mapTx = 0, mapTy = 0, mapScale = 1;
const MIN_SCALE = 1;
const MAX_SCALE = 200;

function svgRect() { return svg.getBoundingClientRect(); }

function clientToVB(cx, cy) {
  const r = svgRect();
  // Because we're using preserveAspectRatio=meet, the SVG maintains its
  // aspect ratio and centres itself inside the container. Compute the
  // actual rendered map rect:
  const containerAspect = r.width / r.height;
  const mapAspect = VB_W / VB_H;
  let mapW, mapH, mapX, mapY;
  if (containerAspect > mapAspect) {
    mapH = r.height;
    mapW = mapH * mapAspect;
    mapX = r.left + (r.width - mapW) / 2;
    mapY = r.top;
  } else {
    mapW = r.width;
    mapH = mapW / mapAspect;
    mapX = r.left;
    mapY = r.top + (r.height - mapH) / 2;
  }
  const vbX = ((cx - mapX) / mapW) * VB_W;
  const vbY = ((cy - mapY) / mapH) * VB_H;
  return [vbX, vbY];
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function clampTranslate(tx, ty, s) {
  const minTx = VB_W - VB_W * s;
  const maxTx = 0;
  const minTy = VB_H - VB_H * s;
  const maxTy = 0;
  return [clamp(tx, minTx, maxTx), clamp(ty, minTy, maxTy)];
}

// Ensure the browser promotes the world group to its own compositor layer.
// For SVG groups, the CSS transform origin needs to be 0,0 in the SVG's
// own coordinate system (which is what we want anyway since we translate
// starting from the origin).
worldGroup.style.willChange = 'transform';
worldGroup.style.transformOrigin = '0 0';

let _transitionEndTimer = null;
function setMapTransform(tx, ty, s, animate) {
  const t = clampTranslate(tx, ty, s);
  mapTx = t[0]; mapTy = t[1]; mapScale = s;
  worldGroup.style.transition = animate
    ? 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)'
    : 'none';
  if (animate) {
    // During the transition we:
    //  - disable hit-testing (skip hover/pointer work)
    //  - flag the view so CSS switches to fast render mode (optimizeSpeed)
    worldGroup.style.pointerEvents = 'none';
    viewServices.classList.add('is-animating');
    if (_transitionEndTimer) clearTimeout(_transitionEndTimer);
    _transitionEndTimer = setTimeout(() => {
      worldGroup.style.pointerEvents = '';
      viewServices.classList.remove('is-animating');
    }, 720);
  } else {
    worldGroup.style.pointerEvents = '';
    viewServices.classList.remove('is-animating');
  }
  worldGroup.style.transform =
    'translate3d(' + mapTx.toFixed(2) + 'px, ' + mapTy.toFixed(2) + 'px, 0) scale(' + mapScale.toFixed(3) + ')';
}

function zoomAround(vbFocusX, vbFocusY, newScale, animate) {
  newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);
  const screenFocusX = vbFocusX * mapScale + mapTx;
  const screenFocusY = vbFocusY * mapScale + mapTy;
  const newTx = screenFocusX - vbFocusX * newScale;
  const newTy = screenFocusY - vbFocusY * newScale;
  setMapTransform(newTx, newTy, newScale, animate);
}

/* Wheel zoom */
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const [vbX, vbY] = clientToVB(e.clientX, e.clientY);
  const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
  zoomAround(vbX, vbY, mapScale * factor, false);
}, { passive: false });

/* Drag pan */
let panActive = false, panStartX = 0, panStartY = 0, panStartTx = 0, panStartTy = 0, panMoved = false;
svg.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.juris-marker')) return;
  panActive = true;
  panMoved  = false;
  panStartX = e.clientX;
  panStartY = e.clientY;
  panStartTx = mapTx;
  panStartTy = mapTy;
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
});
svg.addEventListener('pointermove', (e) => {
  if (!panActive) return;
  const dx = e.clientX - panStartX;
  const dy = e.clientY - panStartY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) panMoved = true;
  const r = svgRect();
  const vbdx = (dx / r.width)  * VB_W;
  const vbdy = (dy / r.height) * VB_H;
  setMapTransform(panStartTx + vbdx, panStartTy + vbdy, mapScale, false);
});
function endPan(e) {
  if (!panActive) return;
  panActive = false;
  try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
}
svg.addEventListener('pointerup', endPan);
svg.addEventListener('pointercancel', endPan);

/* Pinch-to-zoom */
let pinchState = null;
svg.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    panActive = false;
    const [t1, t2] = e.touches;
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const midX = (t1.clientX + t2.clientX) / 2;
    const midY = (t1.clientY + t2.clientY) / 2;
    const [vbX, vbY] = clientToVB(midX, midY);
    pinchState = { startDist: dist, startScale: mapScale, vbX, vbY };
  }
}, { passive: false });
svg.addEventListener('touchmove', (e) => {
  if (pinchState && e.touches.length === 2) {
    e.preventDefault();
    const [t1, t2] = e.touches;
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    zoomAround(pinchState.vbX, pinchState.vbY, pinchState.startScale * (dist / pinchState.startDist), false);
  }
}, { passive: false });
svg.addEventListener('touchend', () => { pinchState = null; });

/* --- Zoom to jurisdiction --- */
function zoomToJurisdiction(key) {
  const j = JURISDICTIONS.find(x => x.key === key);
  if (!j) return;

  // Layout targets, in map viewBox space (0..1000 × 0..560).
  //  - Country occupies the left ~46% of the screen (0..460).
  //  - Card sits from ~50% (500) to the right edge.
  //  - Country's centre lands at 26% (260) so its silhouette is
  //    comfortably to the left of the card with a small gap.
  const COUNTRY_MAX_RIGHT = VB_W * 0.46;
  const COUNTRY_ANCHOR_X  = VB_W * 0.26;
  const COUNTRY_ANCHOR_Y  = VB_H * 0.50;

  // Marker-only jurisdictions: zoom around the marker at a fixed scale.
  if (!j.bbox) {
    const [px, py] = project(j.lon, j.lat);
    const scale = clamp(6, MIN_SCALE, MAX_SCALE);
    setMapTransform(COUNTRY_ANCHOR_X - px * scale, COUNTRY_ANCHOR_Y - py * scale, scale, true);
    return;
  }

  const [minLon, minLat, maxLon, maxLat] = j.bbox;
  const [minX, maxY] = project(minLon, minLat);
  const [maxX, minY] = project(maxLon, maxLat);
  const bboxW = Math.max(0.5, maxX - minX);
  const bboxH = Math.max(0.5, maxY - minY);

  // Fit the country into the left-hand zone. Width budget = distance
  // from viewBox left (0) to COUNTRY_MAX_RIGHT; height budget = 85% of
  // viewport height. Pack it in at ~75% of that box for a comfortable
  // frame with some padding.
  const usableW = COUNTRY_MAX_RIGHT * 2; // symmetric around anchor centre
  const usableH = VB_H * 0.85;
  const targetFillRatio = 0.75;
  const fitByW = (usableW * targetFillRatio) / bboxW;
  const fitByH = (usableH * targetFillRatio) / bboxH;
  const targetScale = Math.min(fitByW, fitByH);
  const scale = clamp(targetScale, MIN_SCALE, MAX_SCALE);

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  setMapTransform(COUNTRY_ANCHOR_X - cx * scale, COUNTRY_ANCHOR_Y - cy * scale, scale, true);
}

function resetMap() { setMapTransform(0, 0, 1, true); }

/* --- Jurisdiction card interaction --- */
const jurisCard   = document.getElementById('jurisCard');
const jcTitle     = document.getElementById('jcTitle');
const jcRegCode   = document.getElementById('jcRegCode');
const jcRegName   = document.getElementById('jcRegName');
const jcServices  = document.getElementById('jcServices');
const jcUnique    = document.getElementById('jcUnique');
const jcClose     = document.getElementById('jcClose');
const viewServices = document.getElementById('viewServices');
const sipWhat      = document.getElementById('sipWhat');
const sipHow       = document.getElementById('sipHow');

const SERVICE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>';

/* Populate the left-hand info panel once at boot. Two sections:
   "What we can do for you" (core services with descriptions) and
   "How we do it" (SS&C differentiators). Copy is verbatim from SS&C
   collateral so no per-jurisdiction rewording. */
function renderInfoPanel() {
  const chevron = '<svg class="sip-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const itemHtml = list => list.map(it => `
    <button class="sip-item" type="button" aria-expanded="false">
      <span class="sip-item-label">${it.name}</span>
      ${it.bullets && it.bullets.length ? chevron : ''}
      ${it.bullets && it.bullets.length ? `<ul class="sip-item-bullets">${it.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
    </button>
  `).join('');
  if (sipWhat) sipWhat.innerHTML = itemHtml(CORE_SERVICES);
  if (sipHow)  sipHow.innerHTML  = itemHtml(HOW_WE_DO_IT);
  // Wire up expand/collapse on each item
  document.querySelectorAll('.sip-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const nowOpen = item.getAttribute('aria-expanded') !== 'true';
      item.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
    });
  });
}
renderInfoPanel();

/* Toggle popovers — tapping a dock icon opens its section, tapping
   again closes it, tapping the other one swaps. Selecting a country
   also closes them so the juris card doesn't fight for attention. */
const sipToggleWhat  = document.getElementById('sipToggleWhat');
const sipToggleHow   = document.getElementById('sipToggleHow');
const sipPopoverWhat = document.getElementById('sipPopoverWhat');
const sipPopoverHow  = document.getElementById('sipPopoverHow');
const sipPairs = [
  { btn: sipToggleWhat, pop: sipPopoverWhat },
  { btn: sipToggleHow,  pop: sipPopoverHow  }
];
function setPopover(pair, open) {
  if (!pair.btn || !pair.pop) return;
  pair.pop.classList.toggle('open', open);
  pair.btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  pair.pop.setAttribute('aria-hidden', open ? 'false' : 'true');
}
function closeAllPopovers() {
  sipPairs.forEach(p => setPopover(p, false));
}
sipPairs.forEach(pair => {
  pair.btn?.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = pair.pop.classList.contains('open');
    closeAllPopovers();
    if (!isOpen) setPopover(pair, true);
  });
  // Clicks inside the popover shouldn't fall through to the map
  pair.pop?.addEventListener('click', e => e.stopPropagation());
});

let selectedKey = null;

function selectJurisdiction(key) {
  const j = JURISDICTIONS.find(x => x.key === key);
  if (!j) return;
  closeAllPopovers();
  jcTitle.textContent = j.name;
  jcRegCode.textContent = j.regCode;
  jcRegName.textContent = j.regName;
  jcUnique.innerHTML = (j.unique || []).map(u => `
    <div class="jc-unique-item"><span class="jc-unique-icon"></span><span>${u}</span></div>
  `).join('');
  jcServices.innerHTML = CORE_SERVICES.map(svc => `
    <div class="jc-service">
      <div class="jc-service-icon">${SERVICE_ICON}</div>
      <div class="jc-service-name">${svc.name}</div>
    </div>
  `).join('');
  document.querySelectorAll('.juris-marker').forEach(el => el.classList.toggle('selected', el.getAttribute('data-key') === key));
  document.querySelectorAll('.juris-country').forEach(el => el.classList.toggle('selected', el.getAttribute('data-key') === key));
  selectedKey = key;
  viewServices.classList.add('has-selection');
  jurisCard.classList.add('open');
  jurisCard.setAttribute('aria-hidden', 'false');
  zoomToJurisdiction(key);
}

function closeJurisdictionCard() {
  jurisCard.classList.remove('open');
  jurisCard.setAttribute('aria-hidden', 'true');
  selectedKey = null;
  // Start the zoom-out animation immediately.
  resetMap();
  // Wait until AFTER the zoom-out finishes before restoring the markers
  // and labels — otherwise the blue pulses appear while the map is still
  // zoomed in on the country, which looks wrong.
  setTimeout(() => {
    document.querySelectorAll('.juris-marker.selected').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.juris-country.selected').forEach(el => el.classList.remove('selected'));
    viewServices.classList.remove('has-selection');
  }, 700); // matches setMapTransform's 0.7s zoom duration
}

svg.addEventListener('click', (e) => {
  if (panMoved) { panMoved = false; return; }
  const marker  = e.target.closest('.juris-marker');
  const country = e.target.closest('.juris-country');
  const key = marker ? marker.getAttribute('data-key')
            : country ? country.getAttribute('data-key')
            : null;
  if (key) {
    e.stopPropagation();
    selectJurisdiction(key);
  }
});

viewServices.addEventListener('click', (e) => {
  if (e.target.closest('.juris-card')) return;
  if (e.target.closest('.juris-marker')) return;
  if (e.target.closest('.juris-country')) return;
  if (e.target.closest('.back-home')) return;
  if (e.target === svg || svg.contains(e.target)) return;
  if (selectedKey) closeJurisdictionCard();
});

jcClose.addEventListener('click', (e) => { e.stopPropagation(); closeJurisdictionCard(); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && selectedKey) closeJurisdictionCard();
});

document.addEventListener('contextmenu', (e) => e.preventDefault());



