<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SS&C Technologies — Innovation Room</title>
<style>
  :root {
    --ssc-blue:       #0077C8;
    --ssc-cobalt:     #0B4D99;
    --ssc-navy:       #131E58;
    --ssc-teal:       #1099AC;
    --ssc-yellow:     #F5AB0A;
    --ssc-accent:     #7AD6FF;

    --bg-deep:        #050B24;
    --bg-navy:        #0A1330;
    --bg-navy-2:      #131E58;

    --panel-bg:       rgba(11, 25, 67, 0.55);
    --panel-border:   rgba(122, 214, 255, 0.22);

    --text:       #FFFFFF;
    --text-muted: rgba(255, 255, 255, 0.75);
    --text-dim:   rgba(255, 255, 255, 0.55);

    /* UI scale — applied as a multiplier via calc() to every dimension */
    --s: 1;
    /* Bubble size bumped so the larger satellite text fits without wrapping. */

    /* Base sizes (unscaled) */
    --card-size: 200px;
    --sat-size:  245px;
    --event-w:   170px;
    --event-gap: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(1400px 900px at 20% 100%, rgba(16, 153, 172, 0.10) 0%, transparent 60%),
      radial-gradient(1600px 900px at 80% 0%,   rgba(0, 119, 200, 0.10)  0%, transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-navy) 40%, var(--bg-navy-2) 100%);
    color: var(--text);
    min-height: 100vh;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ===================================================================
     VIEW ROUTER — one <div class="view"> per page, only one shown at a time
     =================================================================== */
  .view {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  body[data-view="cover"]    .view[data-view="cover"],
  body[data-view="timeline"] .view[data-view="timeline"],
  body[data-view="services"] .view[data-view="services"] {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
  }

  /* ===================================================================
     SHARED UI
     =================================================================== */
  .back-home {
    position: fixed;
    top: 24px; left: 24px;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 22px 12px 18px;
    border-radius: 999px;
    background: rgba(11, 25, 67, 0.65);
    border: 1px solid rgba(122, 214, 255, 0.30);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 1em; font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    z-index: 300;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .back-home:hover, .back-home:active {
    background: var(--ssc-blue);
    border-color: var(--ssc-blue);
    transform: translateY(-2px);
  }
  .back-home .arrow { font-size: 1.1em; line-height: 1; }

  /* Size selector — +/- pill */
  .size-selector {
    position: fixed;
    top: 24px; right: 24px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(11, 25, 67, 0.65);
    border: 1px solid rgba(122, 214, 255, 0.30);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 250;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  body.is-zoomed .size-selector { opacity: 0; pointer-events: none; visibility: hidden; }
  .size-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 1.2em;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    padding: 0;
    line-height: 1;
  }
  .size-btn:hover { background: rgba(122, 214, 255, 0.15); }
  .size-btn:active { background: var(--ssc-blue); }
  .size-btn svg { width: 18px; height: 18px; }

  /* Autoplay toggle — same pill shape and height as the size selector */
  .autoplay-toggle {
    position: fixed;
    top: 24px;
    right: 24px;  /* JS repositions to sit LEFT of the size selector after layout */
    display: flex;
    align-items: center;
    padding: 4px;
    border-radius: 999px;
    background: rgba(11, 25, 67, 0.65);
    border: 1px solid rgba(122, 214, 255, 0.30);
    color: #FFFFFF;
    font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 260;                      /* above size selector so it can't be masked */
    transition: opacity 0.35s ease, visibility 0.35s ease, border-color 0.2s ease, background 0.2s ease;
  }
  body.is-zoomed .autoplay-toggle { opacity: 0; pointer-events: none; visibility: hidden; }
  .autoplay-toggle:hover { border-color: var(--ssc-accent); }
  .autoplay-icon {
    width: 38px;                       /* same as .size-btn */
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ssc-accent);
    background: transparent;
    transition: background 0.2s ease, color 0.2s ease;
    pointer-events: none;              /* clicks pass through to the button */
  }
  .autoplay-toggle:hover .autoplay-icon { background: rgba(122, 214, 255, 0.15); }
  .autoplay-toggle.on .autoplay-icon {
    background: var(--ssc-blue);
    color: #FFFFFF;
  }
  .autoplay-icon svg { width: 16px; height: 16px; display: block; }
  .autoplay-label {
    color: rgba(255, 255, 255, 0.85);
    text-transform: uppercase;
    font-size: 0.75em;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 0 12px 0 6px;
    pointer-events: none;
    line-height: 1;
  }
  .autoplay-toggle.on .autoplay-label { color: var(--ssc-accent); }

  .size-label {
    min-width: 44px;
    text-align: center;
    color: var(--ssc-accent);
    font-weight: 700;
    font-size: 0.85em;
    letter-spacing: 0.5px;
  }

  /* ===================================================================
     COVER VIEW
     =================================================================== */
  .view-cover {
    align-items: center;
    justify-content: center;
    padding: 40px 30px;
    text-align: center;
  }
  .cover-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 60px;
    animation: fadeIn 0.9s ease both;
  }
  .view-cover .logo-img {
    height: clamp(180px, 14vw, 380px);
    width: auto;
    display: block;
    margin: 0 auto;
    filter: brightness(0) invert(1);
    image-rendering: -webkit-optimize-contrast;
  }
  .view-cover .menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 1.5vw, 40px);
  }
  .menu-link {
    font-size: clamp(1.4em, 1.6vw, 3em);
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #FFFFFF;
    text-decoration: none;
    padding: clamp(16px, 1.4vw, 32px) clamp(32px, 3.2vw, 72px);
    border-radius: 999px;
    border: 1.5px solid rgba(122, 214, 255, 0.35);
    background: rgba(11, 25, 67, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 18px;
    transition: color 0.25s ease, background 0.25s ease, transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .menu-link .arrow {
    font-size: 0.9em;
    color: var(--ssc-accent);
    opacity: 0.9;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .menu-link:hover, .menu-link:active {
    background: rgba(11, 77, 153, 0.65);
    border-color: var(--ssc-accent);
    box-shadow: 0 18px 44px rgba(0, 119, 200, 0.35), inset 0 0 0 1px rgba(122, 214, 255, 0.35);
    transform: translateY(-2px);
  }
  .menu-link:hover .arrow, .menu-link:active .arrow { opacity: 1; transform: translateX(4px); }
  .footer-hint {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 0.9em;
    letter-spacing: 1px;
    font-style: italic;
  }

  /* ===================================================================
     TIMELINE VIEW
     =================================================================== */
  /* Header and filter-bar are absolute overlays at the top of the view,
     NOT flex children. This way the viewport claims 100% of the .view
     height, the timeline can pan into the top area without being clipped
     by a header/filter-bar "ghost band", and zoom toggling doesn't shift
     the layout — which keeps the zoom-in / zoom-out animation smooth.
     The viewport pads its top by --topbar-h (set in JS) so the timeline
     visually sits below the overlay in the unzoomed state. */
  .view-timeline header {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(20px, 1.8vw, 44px) 30px clamp(4px, 0.4vw, 12px);
    z-index: 3;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  /* Logo scales continuously with viewport width — clamp keeps it a
     sensible size from mobile up to an 8000px kiosk wall. */
  .view-timeline .logo-img {
    height: clamp(96px, 7vw, 240px);
    width: auto;
    display: block;
    filter: brightness(0) invert(1);
  }
  body.is-zoomed .view-timeline header,
  body.is-zoomed .view-timeline .filter-bar,
  body.is-zoomed .view-timeline .back-home { opacity: 0; pointer-events: none; visibility: hidden; }

  .filter-bar {
    position: absolute;
    top: var(--header-h, 0px);
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: clamp(10px, 0.9vw, 24px);
    padding: clamp(6px, 0.6vw, 14px) 30px clamp(12px, 1vw, 24px);
    z-index: 4;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .filter-pill {
    display: inline-flex;
    align-items: center;
    gap: clamp(8px, 0.6vw, 14px);
    padding: clamp(8px, 0.7vw, 16px) clamp(18px, 1.4vw, 34px);
    border-radius: 999px;
    background: rgba(11, 25, 67, 0.55);
    border: 1.5px solid rgba(122, 214, 255, 0.30);
    color: #FFFFFF;
    font-family: inherit;
    font-size: clamp(0.88em, 0.75vw, 1.35em);
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease, color 0.25s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .filter-pill:hover { transform: translateY(-1px); }
  .filter-pill .filter-dot {
    width: clamp(9px, 0.7vw, 16px);
    height: clamp(9px, 0.7vw, 16px);
    border-radius: 50%;
    background: var(--ssc-accent);
    transition: background 0.25s ease;
    box-shadow: 0 0 6px rgba(122, 214, 255, 0.6);
  }
  .filter-pill.milestone .filter-dot   { background: #7AD6FF; }
  .filter-pill.acquisition .filter-dot { background: var(--ssc-yellow); box-shadow: 0 0 6px rgba(245, 171, 10, 0.6); }
  .filter-pill.active {
    background: rgba(11, 77, 153, 0.65);
    color: #fff;
    border-color: var(--ssc-accent);
    box-shadow: 0 8px 20px rgba(0, 119, 200, 0.28), inset 0 0 0 1px rgba(122, 214, 255, 0.35);
  }
  .filter-pill.acquisition.active {
    border-color: var(--ssc-yellow);
    box-shadow: 0 8px 20px rgba(245, 171, 10, 0.25), inset 0 0 0 1px rgba(245, 171, 10, 0.35);
  }
  .filter-pill:not(.active) { opacity: 0.65; }

  .viewport {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    /* --topbar-h is set in JS to header height + filter-bar height, so
       the timeline visually starts below the topbar overlay. When zoomed,
       header + filter-bar are visibility:hidden but the padding stays,
       so the viewport's outer bounds never change — no layout shift,
       no clipping when the user pans the card up into that area. */
    padding: calc(var(--topbar-h, 0px) + 20px) 40px 40px;
    cursor: grab;
    touch-action: pan-x;
    scroll-behavior: auto;
    position: relative;
  }
  .viewport:active { cursor: grabbing; }
  .viewport::-webkit-scrollbar { height: 14px; }
  .viewport::-webkit-scrollbar-track {
    background: rgba(122, 214, 255, 0.08);
    border-radius: 7px;
  }
  .viewport::-webkit-scrollbar-thumb {
    background: rgba(122, 214, 255, 0.45);
    border-radius: 7px;
  }
  .viewport::-webkit-scrollbar-thumb:hover { background: rgba(122, 214, 255, 0.75); }

  .timeline {
    position: relative;
    height: calc(700px * var(--s));
    min-width: max-content;
    padding: 0 80px;
    white-space: nowrap;
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    transform-origin: 50% 50%;
  }
  body.is-zoomed .timeline { will-change: transform; }
  .timeline.no-transition { transition: none !important; }

  /* Era text watermarks were removed — the skyline motifs alone tell the
     story of each decade. Keep .decade-band as a no-op container in case
     any JS still references it. */
  .decade-band { display: none; }

  /* Skyline banner — larger, more prominent, brand-palette icons. Scrolls
     with the timeline horizontally. Sits at the bottom of the timeline
     strip and spans its full width. */
  .skyline-band {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: calc(260px * var(--s));
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.22s ease;
    overflow: hidden;
  }
  body.is-zoomed .skyline-band { opacity: 0; }
  /* While the timeline is reflowing after a filter click, hide the
     skyline so motif positions don't visibly snap through intermediate
     event widths. It's rebuilt + faded back in once the layout settles. */
  .skyline-band.reflowing { opacity: 0; }
  .skyline-band svg { transition: opacity 0.22s ease; }
  .skyline-band svg {
    position: absolute;
    left: 0; bottom: 0;
    height: 100%;
    /* Width is set inline to match timeline.scrollWidth in JS so motifs align
       to real event positions and don't stretch. */
    display: block;
  }
  /* Line-art strokes in SS&C accent light-blue. */
  .skyline-band .sk-line {
    stroke: rgba(122, 214, 255, 0.85);
    fill: none;
    stroke-width: 2.2;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  /* Highlight accents in soft white — replaces prior yellow accent. */
  .skyline-band .sk-accent {
    stroke: rgba(255, 255, 255, 0.95);
    fill: none;
    stroke-width: 2.4;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  /* Formerly teal — now clean white for tech/network motifs. */
  .skyline-band .sk-teal {
    stroke: rgba(255, 255, 255, 0.88);
    fill: none;
    stroke-width: 2.2;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  /* Solid soft-fill for weightier shapes (buildings etc.). */
  .skyline-band .sk-fill {
    fill: rgba(0, 119, 200, 0.20);
    stroke: rgba(122, 214, 255, 0.85);
    stroke-width: 2;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  /* Formerly yellow — celebration fills keep a subtle gold glow but the
     stroke is now white, so trophies/bells sit in the blue+white palette. */
  .skyline-band .sk-fill-yellow {
    fill: rgba(255, 214, 120, 0.18);
    stroke: rgba(255, 255, 255, 0.95);
    stroke-width: 2;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  /* Formerly teal fill — now white translucent fill. */
  .skyline-band .sk-fill-teal {
    fill: rgba(255, 255, 255, 0.14);
    stroke: rgba(255, 255, 255, 0.90);
    stroke-width: 2;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  /* Faint horizon ground line. */
  .skyline-band .sk-ground {
    stroke: rgba(122, 214, 255, 0.45);
    stroke-width: 1;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    fill: none;
  }
  /* Text labels within a motif (e.g. $2T, AI, SSNC). */
  .skyline-band .sk-text {
    fill: rgba(255, 255, 255, 0.98);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-weight: 800;
  }

  .timeline::before {
    content: '';
    position: absolute;
    top: calc(50% - 50px * var(--s));
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      rgba(122, 214, 255, 0) 0%,
      rgba(122, 214, 255, 0.55) 8%,
      rgba(122, 214, 255, 0.85) 50%,
      rgba(122, 214, 255, 0.55) 92%,
      rgba(122, 214, 255, 0) 100%);
    border-radius: 2px;
    transform: translateY(-50%);
    z-index: 1;
    transition: opacity 0.4s ease;
  }
  body.is-zoomed .timeline::before { opacity: 0; }

  .event {
    position: relative;
    display: inline-block;
    vertical-align: middle;
    /* --event-gap-scale grows when a filter hides some events, so the
       remaining events spread out over roughly the same total timeline
       width — the timeline reads consistently across all filter states. */
    width: calc(var(--event-w) * var(--s) * var(--event-gap-scale, 1));
    margin: 0 calc(var(--event-gap) * var(--s) * var(--event-gap-scale, 1));
    height: calc(700px * var(--s));
    animation: fadeIn 0.7s ease both;
    white-space: normal;
    transition: opacity 0.35s ease, width 0.35s ease, margin 0.35s ease;
  }
  .event.filtered-out { display: none; }
  body.is-zoomed .event:not(.is-focused) { opacity: 0; pointer-events: none; }

  .dot {
    position: absolute;
    top: calc(50% - 50px * var(--s));
    left: 50%;
    width: calc(22px * var(--s));
    height: calc(22px * var(--s));
    background: var(--ssc-accent);
    border: 4px solid var(--bg-navy);
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--ssc-accent), 0 0 12px rgba(122, 214, 255, 0.6);
    transform: translate(-50%, -50%);
    z-index: 3;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.28s ease,
                background 0.28s ease,
                opacity 0.4s ease;
    cursor: pointer;
  }
  .dot:hover {
    transform: translate(-50%, -50%) scale(1.45);
    background: #FFFFFF;
    box-shadow: 0 0 0 3px var(--ssc-accent), 0 0 20px rgba(122, 214, 255, 0.85);
  }
  /* When zooming in, snap the dot to its neutral (unhovered) transform
     immediately — otherwise the dot's own hover-scale transition fights
     the parent zoom animation and produces a visible bounce. Only the
     opacity keeps its transition so the dot still fades out smoothly. */
  body.is-zoomed .dot {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.25s ease;
  }

  .year-tag {
    position: absolute;
    left: 50%;
    top: calc(50% - 50px * var(--s) + 26px * var(--s));
    transform: translateX(-50%);
    font-size: calc(1.15em * var(--s));
    font-weight: 700;
    color: var(--ssc-accent);
    letter-spacing: 1px;
    z-index: 2;
    transition: opacity 0.4s ease;
  }
  .event:nth-child(even) .year-tag {
    top: auto;
    bottom: calc(50% + 50px * var(--s) + 26px * var(--s));
  }
  body.is-zoomed .event:not(.is-focused) .year-tag { opacity: 0; }

  .card {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: calc(var(--card-size) * var(--s));
    height: calc(var(--card-size) * var(--s));
    background: rgba(11, 25, 67, 0.85);
    border: 2px solid rgba(122, 214, 255, 0.32);
    border-radius: 50%;
    padding: calc(22px * var(--s)) calc(22px * var(--s));
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(122, 214, 255, 0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    text-align: center;
    cursor: pointer;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Category tinting — matches the filter pill colours */
  .event[data-category="milestone"] .card {
    border-color: rgba(16, 153, 172, 0.65);     /* SS&C teal */
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px rgba(16, 153, 172, 0.15),
                0 0 18px rgba(16, 153, 172, 0.18);
  }
  .event[data-category="acquisition"] .card {
    /* Same footprint as milestones for professional consistency — the
       yellow ring + stronger border-width does the emphasis work. */
    border-width: 3px;
    border-color: rgba(245, 171, 10, 0.85);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45),
                inset 0 0 0 1px rgba(245, 171, 10, 0.28),
                0 0 26px rgba(245, 171, 10, 0.32);
  }
  .event[data-category="acquisition"] .title {
    font-size: calc(1.02em * var(--s));
  }
  .card:hover, .card:active {
    background: rgba(11, 77, 153, 0.65);
    transform: translateX(-50%) scale(1.05);
  }
  .event[data-category="milestone"] .card:hover,
  .event[data-category="milestone"] .card:active {
    border-color: var(--ssc-teal);
    box-shadow: 0 16px 40px rgba(16, 153, 172, 0.45),
                inset 0 0 0 1px rgba(16, 153, 172, 0.35);
  }
  .event[data-category="acquisition"] .card:hover,
  .event[data-category="acquisition"] .card:active {
    border-color: var(--ssc-yellow);
    box-shadow: 0 16px 40px rgba(245, 171, 10, 0.4),
                inset 0 0 0 1px rgba(245, 171, 10, 0.35);
  }
  .event:nth-child(odd)  .card { bottom: calc(50% + 50px * var(--s) + 66px * var(--s)); }
  .event:nth-child(even) .card { top:    calc(50% - 50px * var(--s) + 66px * var(--s)); }

  .connector {
    position: absolute;
    left: 50%;
    width: 2px;
    background: rgba(122, 214, 255, 0.35);
    transform: translateX(-50%);
    z-index: 1;
    transition: opacity 0.4s ease;
  }
  .event:nth-child(odd)  .connector { bottom: calc(50% + 50px * var(--s)); height: calc(66px * var(--s)); }
  .event:nth-child(even) .connector { top:    calc(50% - 50px * var(--s)); height: calc(66px * var(--s)); }
  body.is-zoomed .connector { opacity: 0; }

  .title {
    font-size: calc(0.96em * var(--s));
    font-weight: 700;
    margin-bottom: calc(5px * var(--s));
    color: #FFFFFF;
    line-height: 1.18;
  }
  .short {
    font-size: calc(0.8em * var(--s));
    color: #E7EEF7;
    line-height: 1.32;
    font-weight: 500;
  }
  .tap-icon {
    margin: calc(6px * var(--s)) auto 0;
    width: calc(16px * var(--s));
    height: calc(16px * var(--s));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ssc-accent);
    opacity: 0.6;
    transition: opacity 0.25s ease, transform 0.25s ease;
    flex-shrink: 0;
  }
  .tap-icon svg { width: 100%; height: 100%; }
  .card:hover .tap-icon, .card:active .tap-icon { opacity: 1; transform: translateY(-2px); }

  body.is-zoomed .viewport { overflow: hidden; cursor: grab; }
  body.is-zoomed.panning .viewport { cursor: grabbing; }
  body.is-zoomed .card { cursor: default; }
  body.is-zoomed .card:hover {
    transform: translateX(-50%);
    background: rgba(11, 25, 67, 0.85);
  }
  /* Neutralise the hover ring while zoomed so it doesn't overpower the focused card */
  body.is-zoomed .event[data-category="milestone"] .card:hover,
  body.is-zoomed .event[data-category="milestone"] .card:active {
    border-color: rgba(16, 153, 172, 0.65);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px rgba(16, 153, 172, 0.15),
                0 0 18px rgba(16, 153, 172, 0.18);
  }
  body.is-zoomed .event[data-category="acquisition"] .card:hover,
  body.is-zoomed .event[data-category="acquisition"] .card:active {
    border-color: rgba(245, 171, 10, 0.65);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px rgba(245, 171, 10, 0.15),
                0 0 18px rgba(245, 171, 10, 0.15);
  }
  /* Focused (zoomed-into) card — brighter category tint */
  .event.is-focused .card { cursor: pointer; }
  .event.is-focused[data-category="milestone"] .card {
    border-color: var(--ssc-teal);
    box-shadow: 0 18px 44px rgba(16, 153, 172, 0.5),
                inset 0 0 0 2px rgba(16, 153, 172, 0.4);
  }
  .event.is-focused[data-category="acquisition"] .card {
    border-color: var(--ssc-yellow);
    box-shadow: 0 18px 44px rgba(245, 171, 10, 0.45),
                inset 0 0 0 2px rgba(245, 171, 10, 0.4);
  }
  body.is-zoomed .card .tap-icon { opacity: 0; }

  /* Satellite bubble layer */
  .sat-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 90;
    transform: translate3d(0, 0, 0);
    transition: none;
  }
  .satellite {
    position: absolute;
    top: 0; left: 0;
    width: calc(var(--sat-size) * var(--s));
    height: calc(var(--sat-size) * var(--s));
    margin-left: calc(var(--sat-size) * var(--s) / -2);
    margin-top:  calc(var(--sat-size) * var(--s) / -2);
    background: rgba(11, 25, 67, 0.9);
    border: 1px solid rgba(122, 214, 255, 0.35);
    border-radius: 50%;
    padding: calc(24px * var(--s)) calc(28px * var(--s)) calc(24px * var(--s));
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    transform: translate3d(0, 0, 0) scale(0.35);
    transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
  }
  .satellite.in { opacity: 1; will-change: transform, opacity; }
  body.is-zoomed.panning .satellite { transition: none !important; }
  .satellite:hover {
    box-shadow: 0 18px 40px rgba(0, 119, 200, 0.45);
    background: rgba(11, 77, 153, 0.85);
  }
  .sat-body { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .sat-label {
    font-size: calc(0.82em * var(--s));
    font-weight: 800;
    letter-spacing: 1.4px;
    color: var(--ssc-accent);
    text-transform: uppercase;
    margin-bottom: calc(8px * var(--s));
    line-height: 1;
  }
  .sat-text {
    color: #FFFFFF;
    font-weight: 700;
    line-height: 1.38;
    font-size: calc(1.02em * var(--s));
    overflow-wrap: break-word;
    letter-spacing: 0.15px;
    /* No line-clamp — bubble is sized to fit the full text. */
  }
  /* Circular portrait photo used inside a satellite bubble (e.g. the
     Bill Stone bubble on the 1986 event). Sized to fill the bubble
     generously so the face reads clearly at kiosk distance. */
  .satellite.has-photo .sat-photo {
    display: block;
    width: calc(140px * var(--s));
    height: calc(140px * var(--s));
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--ssc-accent);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    margin-bottom: calc(6px * var(--s));
  }
  .satellite.has-photo .sat-label {
    margin-bottom: calc(2px * var(--s));
    font-size: calc(0.72em * var(--s));
  }
  .satellite.has-photo .sat-text { font-size: calc(0.9em * var(--s)); }
  /* Logo bubble — PILL shape (landscape rounded-rectangle) instead of a
     circle. Landscape brand marks fit their natural aspect ratio here
     without cropping, and square source images get much more vertical
     room. No transform-scale, so the browser doesn't upscale bitmaps
     past their native size — logos stay crisp. */
  .satellite.logo-bubble {
    /* Pill matched to the 3:1 aspect ratio that .claude/trim-whitespace.ps1
       normalises all logos to. Every logo therefore fills the pill
       identically with its content dead-centre — no more asymmetric
       placement. */
    width: calc(320px * var(--s));
    height: calc(115px * var(--s));
    margin-left: calc(320px * var(--s) / -2);
    margin-top:  calc(115px * var(--s) / -2);
    border-radius: 999px;
    background: #FFFFFF;
    border-color: rgba(0, 119, 200, 0.55);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45),
                inset 0 0 0 1px rgba(0, 119, 200, 0.15);
    overflow: hidden;
    padding: calc(10px * var(--s)) calc(30px * var(--s));
  }
  .satellite.logo-bubble:hover,
  .satellite.logo-bubble:active {
    background: #FFFFFF;
    box-shadow: 0 18px 40px rgba(0, 119, 200, 0.45),
                inset 0 0 0 1px rgba(0, 119, 200, 0.4);
    /* Cancel the circular scale hover so pills stay pill-shaped */
    transform: translate3d(var(--sat-tx, 0), var(--sat-ty, 0), 0);
  }
  .satellite.logo-bubble .sat-label { color: var(--ssc-cobalt); }
  .satellite.logo-bubble .sat-text  { color: var(--ssc-navy); }
  /* Logo image inside the pill — displayed at its native pixel size
     (no scale hack) so nothing gets upscaled. */
  .satellite.logo-bubble .sat-photo {
    width: calc(230px * var(--s));
    height: auto;
    max-height: calc(78px * var(--s));
    border: none;
    border-radius: calc(3px * var(--s));
    object-fit: contain;
    background: transparent;
    padding: 0;
    box-shadow: none;
    margin-bottom: calc(6px * var(--s));
    transform: none;
    image-rendering: auto;
  }
  /* Logo-only variant — no label/text, the image fills nearly the whole
     pill so the mark is as big as possible. Used for the dedicated
     brand-logo satellites (Battea, Blue Prism, Advent, etc.). */
  .satellite.logo-bubble.logo-only {
    padding: calc(6px * var(--s)) calc(22px * var(--s));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .satellite.logo-bubble.logo-only .sat-photo {
    width: 100%;
    max-width: calc(280px * var(--s));
    max-height: calc(95px * var(--s));
    margin-bottom: 0;
    image-rendering: auto;
  }

  /* Category-colored outlines on satellite bubbles — mirror the main
     card's ring so every bubble reads as part of its parent event. Teal
     for milestones, yellow for acquisitions. */
  .satellite[data-category="milestone"] {
    border-color: rgba(16, 153, 172, 0.75);
    border-width: 2px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45),
                0 0 20px rgba(16, 153, 172, 0.22);
  }
  .satellite[data-category="acquisition"] {
    border-color: rgba(245, 171, 10, 0.75);
    border-width: 2px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45),
                0 0 20px rgba(245, 171, 10, 0.22);
  }
  /* Logo pills (white business-card background) — same category tint,
     but keep the inner white ring so the brand mark still sits on a
     clean surface. Higher specificity needed because .satellite.logo-bubble
     sets border-color explicitly. */
  .satellite.logo-bubble[data-category="milestone"] {
    border-color: rgba(16, 153, 172, 0.75);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45),
                inset 0 0 0 1px rgba(16, 153, 172, 0.2),
                0 0 20px rgba(16, 153, 172, 0.22);
  }
  .satellite.logo-bubble[data-category="acquisition"] {
    border-color: rgba(245, 171, 10, 0.75);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45),
                inset 0 0 0 1px rgba(245, 171, 10, 0.2),
                0 0 20px rgba(245, 171, 10, 0.22);
  }

  /* Bubble second-level zoom modal */
  .bubble-detail {
    position: fixed;
    inset: 0;
    z-index: 210;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(5, 11, 36, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    animation: fadeInBackdrop 0.25s ease;
    padding: 40px;
  }
  .bubble-detail.open { display: flex; }
  .bubble-detail-panel {
    background: rgba(11, 25, 67, 0.95);
    border-radius: 22px;
    border-top: 6px solid var(--ssc-accent);
    max-width: 720px;
    width: 100%;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    animation: popIn 0.4s cubic-bezier(0.22,1,0.36,1);
    position: relative;
    color: #FFFFFF;
  }
  .bd-img {
    height: 120px;
    background: rgba(122, 214, 255, 0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ssc-accent);
  }
  .bd-img svg { width: 52px; height: 52px; opacity: 0.85; }
  .bd-body { padding: 30px 38px 36px; }
  .bd-label {
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ssc-accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .bd-text { color: #FFFFFF; font-size: 1.35em; line-height: 1.6; font-weight: 500; }

  /* Close buttons — flex-centred SVG */
  .bd-close, .zoom-close {
    background: rgba(11, 25, 67, 0.85);
    color: #FFFFFF;
    border: 1px solid rgba(122, 214, 255, 0.35);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }
  .bd-close svg, .zoom-close svg { width: 46%; height: 46%; display: block; }
  .bd-close {
    position: absolute;
    top: 20px; right: 20px;
    width: 52px; height: 52px;
    background: rgba(255, 255, 255, 0.08);
  }
  .bd-close:hover, .bd-close:active,
  .zoom-close:hover, .zoom-close:active {
    background: var(--ssc-blue);
    border-color: var(--ssc-blue);
    transform: scale(1.07);
  }
  .zoom-close {
    position: fixed;
    top: 24px; right: 24px;
    width: 60px; height: 60px;
    display: none;
    z-index: 200;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  body.is-zoomed .zoom-close { display: flex; }

  /* ===================================================================
     SERVICES VIEW
     =================================================================== */
  .view-services { overflow: hidden; }

  /* Faint header caption block sitting at top-centre of the view */
  .services-header {
    position: absolute;
    top: 32px; left: 0; right: 0;
    z-index: 10;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .services-header .page-title {
    font-size: 2em;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: 0.8px;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
  }
  .services-header .page-subtitle {
    color: rgba(255, 255, 255, 0.7);
    font-size: 1em;
    margin-top: 6px;
    letter-spacing: 0.5px;
    font-style: italic;
  }
  .view-services.has-selection .services-header .page-subtitle { opacity: 0.35; }

  /* Curved wireframe map — SVG covering the whole view */
  .map-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  .map-canvas:active { cursor: grabbing; }
  .map-canvas .continent {
    fill: rgba(0, 119, 200, 0.10);
    stroke: rgba(122, 214, 255, 0.55);
    stroke-width: 1.1;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    transition: fill 0.35s ease, stroke 0.35s ease, filter 0.35s ease;
    shape-rendering: geometricPrecision;
  }
  /* While the map is animating a zoom, use faster rendering mode.
     drop-shadow is one of the most expensive filters — hoist it off the
     paths and only apply it to the selected country. */
  .view-services.is-animating .map-canvas .continent { shape-rendering: optimizeSpeed; }
  /* During the map zoom transition, kill EVERY visual effect that fights
     with the transform: drop-shadow filters (re-rasterized per frame at
     the scaled size — the primary cause of lag), the pulse animation on
     jurisdiction markers, and the fill/stroke/filter color transitions
     on continents (they'd try to run their own 0.35s animation
     concurrently). Everything comes back the moment the zoom lands. */
  .view-services.is-animating .map-canvas .continent.selected,
  .view-services.is-animating .map-canvas .juris-country.selected,
  .view-services.is-animating .juris-marker .juris-dot,
  .view-services.is-animating .juris-marker.selected .juris-dot,
  .view-services.is-animating .view-services.has-selection .juris-marker.selected .juris-dot {
    filter: none !important;
  }
  .view-services.is-animating .juris-marker .juris-glow { animation: none !important; }
  .view-services.is-animating .map-canvas .continent,
  .view-services.is-animating .map-canvas .juris-country {
    transition: none !important;
  }
  .map-canvas .continent.selected {
    filter: drop-shadow(0 0 4px rgba(245, 171, 10, 0.4));
  }
  /* Jurisdiction countries look clickable */
  .map-canvas .juris-country {
    fill: rgba(0, 119, 200, 0.22);
    cursor: pointer;
  }
  .map-canvas .juris-country:hover {
    fill: rgba(122, 214, 255, 0.28);
    stroke: rgba(122, 214, 255, 0.8);
  }
  .map-canvas .juris-country.selected {
    fill: rgba(245, 171, 10, 0.30);
    stroke: rgba(245, 171, 10, 0.9);
    filter: drop-shadow(0 0 6px rgba(245, 171, 10, 0.55));
  }
  .map-canvas .grid-line {
    fill: none;
    stroke: rgba(122, 214, 255, 0.10);
    stroke-width: 0.5;
    vector-effect: non-scaling-stroke;
  }
  /* When a jurisdiction is selected, dim everything except the chosen country */
  .view-services.has-selection .continent:not(.selected) {
    opacity: 0.35;
  }
  /* Hide labels when zoomed in — big text over a zoomed map looks awful */
  .view-services.has-selection .juris-label { opacity: 0; }
  /* Kill all marker dots + glows completely when a country is selected —
     the country outline IS the highlight when zoomed in, we don't need
     a yellow pulsing circle covering the country. */
  .view-services.has-selection .juris-dot,
  .view-services.has-selection .juris-glow {
    opacity: 0;
    animation: none;
  }
  .juris-label       { transition: opacity 0.35s ease; }
  .juris-dot,
  .juris-glow        { transition: opacity 0.35s ease, transform 0.25s ease; }

  /* Jurisdiction hotspot markers.
     The <g> element uses its own translate() to position the marker on
     the map — we scale the INNER dot/glow/hit elements on hover instead
     so the marker doesn't jump to the origin. */
  .juris-marker {
    cursor: pointer;
    transition: opacity 0.35s ease;
  }
  .juris-marker .juris-dot,
  .juris-marker .juris-glow {
    transition: transform 0.25s ease;
    transform-origin: 0 0;
  }
  .juris-marker:hover .juris-dot,
  .juris-marker:hover .juris-glow { transform: scale(1.5); }
  .juris-marker .juris-glow {
    fill: none;
    stroke: rgba(122, 214, 255, 0.8);
    stroke-width: 1.2;
    opacity: 0;
    animation: jurisPulse 3s ease-out infinite;
  }
  .juris-marker .juris-dot {
    fill: var(--ssc-accent);
    filter: drop-shadow(0 0 4px rgba(122, 214, 255, 0.9));
  }
  .juris-marker.selected .juris-dot {
    fill: var(--ssc-yellow);
    filter: drop-shadow(0 0 5px rgba(245, 171, 10, 0.95));
  }
  .juris-marker.selected .juris-glow { stroke: rgba(245, 171, 10, 0.85); }
  .view-services.has-selection .juris-marker:not(.selected) { opacity: 0.3; }
  .view-services.has-selection .juris-marker.selected .juris-dot {
    fill: var(--ssc-yellow);
    filter: drop-shadow(0 0 6px rgba(245, 171, 10, 1));
  }
  .view-services.has-selection .juris-marker.selected .juris-glow {
    stroke: rgba(245, 171, 10, 0.9);
  }
  .juris-label {
    fill: rgba(255, 255, 255, 0.9);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    paint-order: stroke fill;
    stroke: rgba(5, 11, 36, 0.85);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  @keyframes jurisPulse {
    0%   { r: 3.5; opacity: 0.85; }
    100% { r: 12;  opacity: 0; }
  }

  /* Detail card sits close to the zoomed country. The map anchors the
     country's centre at 26% of viewport width; card starts at 48% so
     the country and card visually pair up with a modest gap. */
  .juris-card {
    position: absolute;
    z-index: 20;
    top: 50%;
    left: 48%;
    width: min(34vw, 440px);
    max-height: 82vh;
    overflow-y: auto;
    background: rgba(11, 25, 67, 0.92);
    border: 1px solid rgba(122, 214, 255, 0.4);
    border-left: 4px solid var(--ssc-accent);
    border-radius: 20px;
    padding: 28px 32px 30px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #FFFFFF;
    opacity: 0;
    transform: translate3d(20px, -50%, 0);
    transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .juris-card.open {
    opacity: 1;
    transform: translate3d(0, -50%, 0);
    pointer-events: auto;
  }
  .jc-close {
    position: absolute;
    top: 12px; right: 12px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(122, 214, 255, 0.3);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .jc-close:hover, .jc-close:active {
    background: var(--ssc-blue);
    transform: scale(1.08);
  }
  .jc-close svg { width: 42%; height: 42%; }
  .jc-country-tag {
    display: inline-block;
    font-size: 0.68em;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(122, 214, 255, 0.18);
    color: var(--ssc-accent);
    border: 1px solid rgba(122, 214, 255, 0.4);
    margin-bottom: 12px;
  }
  .jc-title {
    font-size: 1.7em;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .jc-section {
    margin-top: 18px;
  }
  .jc-section-title {
    font-size: 0.7em;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ssc-accent);
    margin-bottom: 8px;
  }
  .jc-regulator {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(122, 214, 255, 0.10);
    border-radius: 12px;
    border-left: 3px solid var(--ssc-accent);
  }
  .jc-regulator-code {
    font-size: 1.35em;
    font-weight: 800;
    color: var(--ssc-accent);
    letter-spacing: 1px;
    line-height: 1;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .jc-regulator-name {
    font-size: 0.88em;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.35;
    min-width: 0;
  }
  .jc-services {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .jc-service {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(11, 77, 153, 0.35);
    border-radius: 10px;
    color: #FFFFFF;
  }
  .jc-service-icon {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(122, 214, 255, 0.18);
    border: 1px solid rgba(122, 214, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ssc-accent);
    flex-shrink: 0;
  }
  .jc-service-icon svg { width: 14px; height: 14px; }
  .jc-service-name {
    font-size: 0.95em;
    font-weight: 600;
  }

  /* Unique offerings — a compact bullet list on the juris card. */
  .jc-unique {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .jc-unique-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(245, 171, 10, 0.08);
    border-radius: 10px;
    border-left: 3px solid var(--ssc-yellow);
    color: rgba(255, 255, 255, 0.92);
    font-size: 0.88em;
    line-height: 1.4;
  }
  .jc-unique-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ssc-yellow);
    margin-top: 5px;
    flex-shrink: 0;
    box-shadow: 0 0 6px rgba(245, 171, 10, 0.6);
  }

  /* Floating dock of icon toggles — kept small on the left of the map
     so the map stays clean. Fades out when a country is selected. */
  .sip-dock {
    position: absolute;
    z-index: 16;
    top: 50%;
    left: 28px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .view-services.has-selection .sip-dock {
    opacity: 0;
    transform: translate(-20px, -50%);
    pointer-events: none;
  }
  .sip-toggle {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1.5px solid rgba(122, 214, 255, 0.55);
    background: rgba(11, 25, 67, 0.9);
    color: var(--ssc-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.2s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, color 0.25s ease;
  }
  .sip-toggle svg { width: 26px; height: 26px; }
  .sip-toggle:hover,
  .sip-toggle:focus-visible {
    background: rgba(11, 77, 153, 0.85);
    border-color: var(--ssc-accent);
    transform: scale(1.06);
    outline: none;
  }
  .sip-toggle[aria-expanded="true"] {
    background: var(--ssc-blue);
    border-color: var(--ssc-yellow);
    color: #FFFFFF;
    box-shadow: 0 8px 22px rgba(245, 171, 10, 0.35), inset 0 0 0 1px rgba(245, 171, 10, 0.4);
  }

  /* Popovers — anchored to the dock, slide in when their toggle opens. */
  .sip-popover {
    position: absolute;
    z-index: 15;
    left: 100px;
    width: min(26vw, 320px);
    background: rgba(11, 25, 67, 0.94);
    border: 1px solid rgba(122, 214, 255, 0.4);
    border-left: 4px solid var(--ssc-accent);
    border-radius: 18px;
    padding: 18px 20px 20px;
    color: #FFFFFF;
    box-shadow: 0 20px 44px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    transform: translate(-12px, 0);
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sip-popover.open {
    opacity: 1;
    transform: translate(0, 0);
    pointer-events: auto;
  }
  /* Vertical anchoring — line up popover top with its toggle. */
  #sipPopoverWhat { top: calc(50% - 55px); transform-origin: left top; }
  #sipPopoverHow  { top: calc(50% + 15px); transform-origin: left top; }
  #sipPopoverWhat:not(.open) { transform: translate(-12px, -8px); }
  #sipPopoverHow:not(.open)  { transform: translate(-12px, 8px);  }

  .sip-popover-title {
    font-size: 1.05em;
    font-weight: 800;
    color: var(--ssc-accent);
    letter-spacing: 0.2px;
    margin-bottom: 12px;
  }
  .sip-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* Each item is a full-width tappable button. Row 1 shows the label
     and a chevron; expanding reveals a small bullet list below. */
  .sip-item {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 0fr;
    row-gap: 0;
    column-gap: 8px;
    width: 100%;
    padding: 10px 12px 10px 26px;
    background: rgba(11, 77, 153, 0.30);
    border: 1px solid rgba(122, 214, 255, 0.22);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.92em;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, grid-template-rows 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sip-item::before {
    content: "";
    position: absolute;
    left: 12px; top: 20px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ssc-accent);
    box-shadow: 0 0 6px rgba(122, 214, 255, 0.6);
    transform: translateY(-50%);
  }
  .sip-item:hover {
    background: rgba(11, 77, 153, 0.45);
    border-color: rgba(122, 214, 255, 0.4);
  }
  .sip-item[aria-expanded="true"] {
    grid-template-rows: auto 1fr;
    background: rgba(11, 77, 153, 0.5);
    border-color: var(--ssc-accent);
  }
  .sip-item-label {
    grid-column: 1;
    grid-row: 1;
  }
  .sip-chev {
    grid-column: 2;
    grid-row: 1;
    width: 16px; height: 16px;
    color: var(--ssc-accent);
    transition: transform 0.25s ease;
    align-self: center;
  }
  .sip-item[aria-expanded="true"] .sip-chev { transform: rotate(180deg); }
  .sip-item-bullets {
    grid-column: 1 / -1;
    grid-row: 2;
    overflow: hidden;
    margin: 0;
    padding: 0;
    list-style: none;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.92em;
  }
  .sip-item-bullets li {
    position: relative;
    padding: 3px 0 3px 14px;
    line-height: 1.35;
  }
  .sip-item-bullets li::before {
    content: "";
    position: absolute;
    left: 0; top: 0.65em;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(122, 214, 255, 0.6);
  }
  .sip-item[aria-expanded="true"] .sip-item-bullets {
    padding-top: 8px;
    margin-top: 2px;
    border-top: 1px solid rgba(122, 214, 255, 0.18);
  }

     Keyframes
     =================================================================== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInBackdrop { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Kiosk breakpoint kept only for elements not covered by clamp() —
     the timeline logo and filter pills now scale continuously via
     clamp() so they don't need discrete size steps here. */
  @media (min-width: 3000px) {
    .view-services .logo-img { height: 120px; }
    .page-title { font-size: 1.9em; }
    .stage { grid-template-columns: 480px 1fr 560px; padding: 24px 40px 40px; gap: 28px; }
  }
</style>
</head>
<body data-view="cover">

<!-- ============ COVER VIEW ============ -->
